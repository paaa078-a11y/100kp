        a { text-decoration: none; }
        .content { margin: 0 auto; max-width: 1200px; }
        .clearfix { overflow: hidden; _zoom: 1; }
        .header { padding-top: 1.4rem; text-align: center; }
        .header .pic { max-height: 2.2rem; max-width: 100%; }
        .header .city-list {padding: .82rem .4rem; color: #fff; font-size: 0; word-break: keep-all; word-break: normal\9; }
        .header a { position: relative; word-break: keep-all; word-break: normal\9; margin-right: -1px; padding: 0 .14rem; line-height: .4rem; font-size: .19rem; color: #fff; }
        .header a span { position: absolute; top: 50%; right: 0px; margin-top: -.07rem; height: .16rem; border-right: 1px solid #fff; }
        .header .empty-line span { border-right: 0; }
        .main .qrcode { background-image: url("images/border.gif"); background-color: #fff; background-repeat: no-repeat; background-position: center 0; text-align: center; padding-bottom: .6rem;   margin-bottom: .3rem; border-radius: .2rem; text-align: center; }
        .row { margin:0 -.15rem; overflow: hidden; _zoom: 1; box-sizing: border-box;  }
        .col-el { padding: 0 .15rem; min-height: 1px; box-sizing: border-box; }
        .col-xs-6 { width: 50%; float: left; }
        .qrcode .city { padding: .3rem .1rem; color: #fc364b; font-size: .19rem; }
        .qrcode .account { font-size: .18rem; margin-bottom: .1rem; padding: 0 .2rem; }
        .qrcode .btn { margin: 0 auto .32rem; width: 1.8rem; padding: .1rem 0; line-height: 1; vertical-align: middle; text-align: center; font-size: .2rem; color: #fff; background: #6cc426; border-radius: .4rem; cursor: pointer; }
        .qrcode .pic { width: 2rem; height: 2rem; }
        @media screen and (max-width: 767px) {
            .content { width: 700px; width: 7rem; }
        }
        @media screen and (min-width: 768px) {
            .content { width: 700px; width: 7rem; }
            .col-sm-6 { width: 50%; float: left; }
        }
        @media screen and (min-width: 992px) {
            .content { width: 930px; width: 9.3rem; }
            .col-md-4 { width: 33.333%; float: left; }
        }
        @media screen and (min-width: 1200px) {
            .content { width: 1140px; width: 11.4rem; }
            .header a { margin-right: 0;}
        }
        @media \0screen\,screen\9 {
            body{ background-size: auto 910px; font-size: 14px; }
            .content { width: 1200px; padding: 0 15px; }
            .col-md-4 { width: 33.333%; float: left; }
            .header { padding-top: 140px; }
            .header .pic { max-height: 220px; }
            .header .city-list { padding: 82px 40px; word-break: initial; }
            .header a { padding: 0 14px; line-height: 40px; font-size: 20px; word-break: initial; margin-right: 0px;}
            .header a span { margin-top: -7px; height: 16px; }
            .main .qrcode { background-color: transparent; padding-bottom: 60px; margin-bottom: 30px; border-radius: 20px; }
            .row { margin: 0 -15px; }
            .qrcode .city { padding: 30px 10px; font-size: 40px;}
            .qrcode .account { font-size: 18px; margin-bottom: 10px; padding: 0 20px; }
            .qrcode .btn { margin: 0 auto 32px; max-width: 180px; height: 42px; line-height: 42px; font-size: 20px; background-image: url("images/button.gif"); background-repeat: no-repeat; background-position: center 0; background-size: 100%; background-color: transparent; }
            .qrcode .pic { max-width: 100%; max-height: 200px; }
        }
    </style>
