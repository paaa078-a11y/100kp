<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地区选择与二维码展示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: var(--dark-color);
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.5rem;
        }
        
        .search-box {
            margin-bottom: 15px;
            position: relative;
        }
        
        .search-box input {
            padding: 10px 15px 10px 35px;
            border-radius: 20px;
            border: 1px solid #ddd;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s;
            -webkit-appearance: none;
        }
        
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 10px;
            color: #aaa;
            font-size: 14px;
        }
        
        .select-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .select-row select {
            flex: 1;
            min-width: 120px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
            -webkit-appearance: none;
        }
        
        .qr-container {
            text-align: center;
            padding: 20px;
            background-color: var(--light-color);
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .qr-title {
            color: var(--secondary-color);
            margin-bottom: 15px;
            font-weight: 500;
            font-size: 1.1rem;
        }
        
        .qr-code {
            max-width: 200px;
            margin: 0 auto;
            border: 3px solid white;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .qr-description {
            margin-top: 10px;
            color: #7f8c8d;
            font-size: 13px;
        }
        
        .search-results {
            position: absolute;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .search-result-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }
        
        @media (max-width: 576px) {
            .select-row {
                flex-direction: column;
                gap: 8px;
            }
            
            .select-row select {
                width: 100%;
            }
            
            .qr-code {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>地区二维码查询</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入省份、城市或区县名称搜索..." autocomplete="off">
            <div class="search-results" id="searchResults"></div>
        </div>
        
        <div class="select-row">
            <select id="province" class="form-select">
                <option value="">请选择省份</option>
            </select>
            <select id="city" class="form-select" disabled>
                <option value="">请选择城市</option>
            </select>
            <select id="district" class="form-select" disabled>
                <option value="">请选择区县</option>
            </select>
        </div>
        
        <div class="qr-container" id="qrContainer">
            <h3 class="qr-title">请选择地区查看二维码</h3>
            <div class="qr-code">
                <img id="qrImage" src="qrcodes/hao.png" alt="地区二维码" class="img-fluid">
            </div>
            <p class="qr-description" id="selectedArea">默认二维码</p>
        </div>
    </div>

    <script src="area-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
