<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>本地工作推荐群 - 邀你入群</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background-color: #f5f5f5;
    max-width: 750px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background-color: #fff;
  }
  /* 顶部导航栏 */
  .top-bar {
    background-color: #ff7a00;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    color: #fff;
    font-size: 15px;
  }
  .top-bar-left {
    font-weight: bold;
  }
  .top-bar-btn {
    background-color: #fff;
    color: #ff7a00;
    border: none;
    border-radius: 20px;
    padding: 5px 15px;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
  }
  .top-bar-close {
    color: #fff;
    font-size: 18px;
    text-decoration: none;
    margin-left: 10px;
  }
  /* 主体内容 */
  .main-content {
    background: linear-gradient(180deg, #e6fffa 0%, #f5f5f5 100%);
    min-height: calc(100vh - 44px);
    text-align: center;
    position: relative;
  }

  /* 二维码/海报卡片 */
  .card {
    background-color: #fff;
  }
  .poster-img {
    width: 100%;
    max-width: 396px;
    margin: 0 auto;
    display: block;
    cursor: pointer;
  }

  /* 弹窗遮罩 */
  .modal-mask {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.6);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .modal-box {
    width: 80%;
    max-width: 320px;
    background-color: #fff;
    border-radius: 12px;
    padding: 30px 20px;
    text-align: center;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
    color: #999;
    cursor: pointer;
    line-height: 1;
  }
  .modal-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 15px;
    background-color: #07c160;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .modal-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .modal-title {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 10px;
  }
  .modal-desc {
    font-size: 13px;
    color: #888;
    margin-bottom: 25px;
  }
  .modal-btn {
    display: block;
    width: 100%;
    background-color: #07c160;
    color: #fff;
    text-align: center;
    padding: 12px 0;
    border-radius: 8px;
    font-size: 16px;
    text-decoration: none;
    font-weight: bold;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="top-bar">
  <span class="top-bar-left">打开 微信 小程序再进群</span>
  <div>
    <a href="weixin://dl/business/?appid=wx533eca4ff0bfe89b&path=pages/index/index" class="top-bar-btn">打开微信</a>
    <a href="javascript:void(0);" class="top-bar-close">X</a>
  </div>
</div>

<!-- 主体 -->
<div class="main-content">
  <div class="card">
    <!-- 点击海报图触发弹窗 -->
    <img src="https://100kp.com/dm/qun/qun.png" class="poster-img" id="posterImg" alt="群二维码">
  </div>
</div>
<button id="floatBtn"></button>
<!-- 弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal-box">
    <div class="modal-close" id="modalClose">X</div>
    <div class="modal-icon">
      <!-- 使用微信图标SVG适配纯手机端 -->
      <img src="https://100kp.com/dm/qun/qun2.png">
    </div>
    <div class="modal-title">前往微信小程序</div>
    <div class="modal-desc">本页面建议在微信打开，直接进群</div>
    <a href="weixin://dl/business/?appid=wx533eca4ff0bfe89b&path=pages/index/index" class="modal-btn">打开微信入群</a>
  </div>
</div>

<script>
  // 绑定跳转链接
  const schemeUrl = "weixin://dl/business/?appid=wx533eca4ff0bfe89b&path=pages/index/index";
  
  document.getElementById('posterImg').addEventListener('click', function() {
    document.getElementById('modalMask').style.display = 'flex';
  });
  
  document.getElementById('floatBtn').addEventListener('click', function() {
    window.location.href = schemeUrl;
  });
  
  // 关闭弹窗
  document.getElementById('modalClose').addEventListener('click', function() {
    document.getElementById('modalMask').style.display = 'none';
  });
  
  // 点击遮罩空白处关闭
  document.getElementById('modalMask').addEventListener('click', function(e) {
    if(e.target === this) {
      this.style.display = 'none';
    }
  });
</script>

</body>
</html>
