<script type="text/javascript" charset="utf-8">
function replaceSubdomain(url, replacement) {
    // 正则表达式匹配子域名
    const regex = /^(?:https?:\/\/)?([^.]+)\.(.+)/;
    const match = url.match(regex);

    if (match) {
        // 如果找到匹配项，那么第一个捕获组就是子域名，第二个捕获组是剩余部分
        const subdomain = match[1];
        const domainRest = match[2];
        const newUrl = `http://${replacement}.${domainRest}`;
        return newUrl;
    }

    // 如果没有匹配或者不需要替换，则返回原 URL
    return url;
}

	var arr = {};

	var vm = new Vue({
		el: '#app',
		name:"list",
		data: {
			cityList:[],
			indexList:[],
			hyList:[],
			searchKey:'',
			cityShow:true,
			hyShow:true,
			allShow:true,
		},
		created() {
			this.getSite()
		},
		methods: {
			getSite(){
				let self = this;
				$.post(wapurl+'index.php?c=site&a=cache',{rand: Math.random()}, function(res){
					self.cityList = res.city;
					self.hyList = res.hy;
					$.each(res.city, function(index, item){
						self.indexList.push(index);
					});
					$('#app').css('display','block');
				},'json');
			},
			filterTex(indexKey, flag){
				var $this=this;
				var isReturn = false;
				let newCityArray = newHyArray = {};
				$this.allShow = indexKey ? false : true;
				if (flag == 1) {
					if (indexKey) {
						$.each(this.cityList, function(index, citys){
							newCityArray[index] = citys.filter(function(item, index){
								if (item.name.includes(indexKey)) {
									return item;
								}
							})
						});
						$.each(newCityArray, function(index, item){
							if (item != '') {
								isReturn = true;
								return;
							}
						});

						if (isReturn) {
							$this.hyShow = false;
							return newCityArray;
						}
					} else {
						$this.hyShow = true;
						return $this.cityList;
					}
				} else {
					if (indexKey) {
						newHyArray = this.hyList.filter(function(item){
							if (item.hyname.includes(indexKey)) {
								return item;
							}
						});
						$this.hyShow = newHyArray != '' ? true : false;
						if (newHyArray) {
							return newHyArray;
						}
					} else {
						$this.cityShow = true;
						return $this.hyList;
					}
				}
			},
			changeSite(url){
			    var pathname = window.location.pathname || "";
			    if(pathname.indexOf("/m/") >= 0){
			        window.location.href = url.indexOf("/m/") < 0  ? url + "/m/" : url;
			      
			    }else{
				    window.location.href = url;
			    }
			}
		}
	});

</script>
