{yun:}include file="$wapstyle/member/cheader.htm"{/yun}
<div id="yunvue" class="none">
<section class="wap_member_box">
    
    <div class="Subclass" v-for="(item, infokey) in info" :key="infokey">
        
        <div class="com_member_hr_p1">
            <span class="member_c9" >职位类别 </span> {{item.jobname}}
        </div> 
        <div class="com_member_hr_p1">
            <span class="member_c9" >所在城市 </span>{{item.city_name}}
        </div>
        <div class="com_member_hr_p1">
            <span class="member_c9" >月薪范围</span>{{item.salary}}
        </div>
        <div class="com_member_hr_p1">
            <span class="member_c9" >发送周期</span>{{item.time}}天
        </div>
        <div class="interview_card_bom">
            <div class="card_bom_icon">
               <a href="javascript:void(0);" @click="pageTo('index.php?c=setSubscribe&id='+item.id)"><img src="{yun:}$wap_style{/yun}/images/Apply_compile.png" alt=""></a>
            </div>
           <div class="card_bom_icon">
                <a href="javascript:void(0);" @click="pageTo('index.php?c=subscribeRecord&id='+item.id)"><img src="{yun:}$wap_style{/yun}/images/fptc.png" alt=""></a>
           </div>
           <div class="card_bom_icon">
               <a href="javascript:void(0);" @click="del(item.id,infokey)" class=" "><img src="{yun:}$wap_style{/yun}/images/resume_del.png" alt=""></a>
           </div>
        </div>
        
       
    </div>
    <div class="wap_member_nobg" v-if="count==0">  
        <div class="wap_member_no">目前您还没有订阅简历</div>
        <a class="wap_member_no_submit"  href="javascript:void(0);" @click="toSubscribe()" >立即订阅</a>
    </div>
    <div v-if="total >limit" class="page_pd">
    <van-pagination v-model="page" :total-items="total" :items-per-page="limit" force-ellipses @change="pageChange" /> 
    </div>
    <!-- 关注公众号弹框 --> 
    <van-popup v-model="gzhshow" round :closeable="true" :close-on-click-overlay="true">
        <div class="gzh_gzbox">
            <div class="gzh_gzbox_n">关注公众号</div>
                <img :src="gzhurl" @touchstart="gzhstart" @touchend="gzhend">
            <div class="gzh_gzbox_p">长按识别二维码</div>
            <div class="gzh_gzbox_p">随时随地查找好工作</div>
        </div>
    </van-popup>     
</section>
</div>

<script type="text/javascript">
    var loopVal = null;
    var currentPage = parseInt('{yun:}$smarty.get.page{/yun}');
        currentPage = currentPage ? currentPage : 1;
    var yunvue = new Vue({
        el: '#yunvue',
        data: {
            info: [],
            limit:10,       
            total:0,            
            page: currentPage, 

            isSubscribe:0, 

            gzhshow: false,
            gzhurl: '',             
        },
        computed: {
            count(){
                if(this.total > this.limit){
                    return 2;
                }else if(this.info.length==0){
                    return 0;
                }else{
                    return 1;
                }
            }
        },
        created() {   
            this.getlist();
        },
        methods:{
            getlist:function(){
                var that = this;
                var paramer = {};
                paramer['page'] = that.page;
                paramer['limit'] = that.limit;     
                showLoading();
                $.post('{yun:}url d=wxapp h=com m=subscribe c=index{/yun}',paramer,function(data){
                    hideLoading();
                    let list = data.data.list;
                    if (data) {
                        if (list && list.length > 0) {
                            that.info = list;
                        } 
                    }                      
                    that.isSubscribe = data.data.isSubscribe;   
                    that.gzhurl = data.data.gzhurl;                
                    that.total = data.total;
                    that.page = currentPage;
                    $("#yunvue").css('display', 'block');
                },'json');
            },
            del:function(id,key){
                var that = this;                
                var paramer = {
                    id: id,                   
                };
                showConfirm('确定删除?', () => {
                    showLoading('删除中...')
                    $.post('{yun:}url d=wxapp h=com m=subscribe c=del{/yun}', paramer, function(data){
                        hideLoading();
                        if (data.error == 1) {
                            showToast(data.msg,2, function() {
                                location.reload();   
                            });
                        } else {
                            showToast(data.msg);
                        }
                    });
                });
            },
            toSubscribe:function(){
                
                var that = this;

                if (that.isSubscribe == 1) {

                    navigateTo('index.php?c=setSubscribe')
                } else {
                    that.gzhshow = true;
                }
            },
            pageChange:function(e){          
                location.href = 'index.php?c=subscribe&page='+e;
            },
            pageTo:function(url){
                window.location.href = url;
            },
            gzhstart: function(){
                if(loopVal){
                     //再次清空定时器，防止重复注册定时器
                    clearTimeout(loopVal);
                }
                var self = this;
                loopVal = setTimeout(function() {
                    gzhbd();
                }.bind(this), 1000);
            },
            gzhend: function(){
                 if(loopVal){
                    clearTimeout(loopVal);
                    loopVal = null;
                }
            }
        }
    });
    function setsubscribe() {
        yunvue.toSubscribe();
    }
    function isgzh(){
        $.post('index.php?c=isgzh', { rand: Math.random() }, function(res) {
            if(res.subscribe == 2) {
                
                yunvue.$data.gzhshow = false;
                showConfirm('本账号绑定的微信号，不是当前微信号，是否要换绑为当前微信号？', function() {
                    hbwx();
                },'否','是');
                
            }else if(res.subscribe == 1) {
                window.location.reload();
            }
        }, 'json');
    }
    function gzhbd(){
        setInterval(function(){
            isgzh();
        },3000);
    }
    function hbwx(){
        showLoading();
        $.post('{yun:}url d=wxapp h=com m=index c=hbwx{/yun}', { rand: Math.random() }, function(res) {
            hideLoading();
            if(!res.error){
                showToast(res.msg);
            }
        }, 'json');
    }
</script>
</body>
</html>
