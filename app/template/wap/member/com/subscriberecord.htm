{yun:}include file="$wapstyle/member/cheader.htm"{/yun}
<div id="yunvue" class="none">
<section class="wap_member_box">
    <div class="Subclass" v-for="(item, infokey) in info" :key="infokey">
        <div class="sendjob_box">
            <span class="sendjob_span" >推送时间：{{item.time_n}}</span>
        </div>
        <div class="sendjob_box">
            <div class="sendjob_jobbox">
                <div class="sendjob_jobbox_name" v-for="(sendcon, infokey) in item.sendcon" :key="infokey" @click="pageTo(sendcon.wapurl)">
                    <div class="sendjob_jobbox_item">
                        <div class="sendjob_name">{{sendcon.name_n}}</div>
                        <div class="sendjob_price">{{sendcon.salary}}</div>
                    </div>
                    <div class="sendjob_jobbox_item">
                        <div class="sendjob_company">{{sendcon.name}}·{{sendcon.city_classname}}·{{sendcon.type_n}}</div>
                        <div class="sendjob_lookbtn">
                            去看看
                        </div>
                    </div>
                </div>
            </div>
        </div> 
    </div>
    <div class="wap_member_nobg" v-if="count==0">  <div class="wap_member_no">目前您还没有发送记录</div></div>
    <div v-if="total >limit" class="page_pd">
    <van-pagination v-model="page" :total-items="total" :items-per-page="limit" force-ellipses @change="pageChange" /> 
    </div>    
</section>
</div>

<script type="text/javascript">
    var id = parseInt('{yun:}$smarty.get.id{/yun}');
    var currentPage = parseInt('{yun:}$smarty.get.page{/yun}');
        currentPage = currentPage ? currentPage : 1;
    new Vue({
        el: '#yunvue',
        data: {
            id:id,
            info: [],
            limit:10,       
            total:0,            
            page: currentPage,            
        },
        computed: {
            count(){
                if(this.total > this.limit){
                    return 2;
                }else if(this.info.length==0){
                    return 0;
                }else{
                    return 1;
                }
            }
        },
        created() {   
            this.getlist();
        },
        methods:{
            getlist:function(){
                var that = this;
                var paramer = {};
                paramer['id'] = that.id;
                paramer['page'] = that.page;
                paramer['limit'] = that.limit;     
                showLoading();
                $.post('{yun:}url d=wxapp h=com m=subscribe c=record{/yun}',paramer,function(data){
                    hideLoading();
                    let list = data.data;
                    if (data) {
                        if (list && list.length > 0) {
                            that.info = list;
                        } 
                    }                      
                    that.total = data.total;
                    that.page = currentPage;
                    $("#yunvue").css('display', 'block');
                },'json');
            },
            
            pageChange:function(e){          
                location.href = 'index.php?c=subscribe&page='+e;
            },
            pageTo:function(url){
                window.location.href = url;
            }
        }
    });
</script>
</body>
</html>
