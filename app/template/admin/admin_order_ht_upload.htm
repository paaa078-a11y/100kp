<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html;charset=utf-8">
<link href="images/reset.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
<link href="images/system.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
<link href="images/table_form.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
<script> var weburl = '{yun:}$config.sy_weburl{/yun}';</script>
<script src="{yun:}$config.sy_weburl{/yun}/js/jquery-1.8.0.min.js?v={yun:}$config.cachecode{/yun}"></script>
<link href="{yun:}$config.sy_weburl{/yun}/js/layui/css/layui.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
<script src="{yun:}$config.sy_weburl{/yun}/js/layui/layui.js?v={yun:}$config.cachecode{/yun}"></script>
<script src="{yun:}$config.sy_weburl{/yun}/js/layui/phpyun_layer.js?v={yun:}$config.cachecode{/yun}"></script>
<script src="js/admin_public.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<title>后台管理</title>
</head>
<body class="body_ifm">
	<div id="preview"  style="display:none; width:400px; ">
		<div style="height:300px; overflow:auto; width:auto; " >
			<div class="job_box_div" style="text-align:center;margin-top:10px;"></div>
		</div>
	</div>
	<div class="infoboxp">
     <div class="clear"></div>
     	<div id="subboxdiv" style="width:100%;height:100%;display:none;position:absolute;"></div>
     	<div class="tty_table-bom">
     			<iframe id="supportiframe" name="supportiframe" onload="returnmessage('supportiframe');" style="display:none"></iframe>
     			<form class="layui-form" id="myform" action="index.php?m=reward&c=saveset" method="post" enctype="multipart/form-data" target="supportiframe">
     				<div class="enterNewsAll">
     					<div class="admin_bold">合同图片</div>
     					<div class="adminBoldTips">可添加订单合同图片</div>
     					<div class="clear"></div>
						<div class="admin_zphnewimg">
						{yun:}foreach from=$rows item=list{/yun}
							<div class="zph_img">
								<div class="zph_imgbox">
									<div class="zph_imgpic"><img src="{yun:}$list.pic_n{/yun}" onerror="imghidden(this)"></div>	<div class="zph_img_name">{yun:}$list.title{/yun}</div>
									<div class="zph_img_bthbox">
										<a href="javascript:void(0)" onClick="layer_del('确定要删除？', 'index.php?m=company_order&c=htpic_del&delid={yun:}$list.id{/yun}');" class=" zph_img_bth">删除</a>
									</div>
								</div>
							</div>
						{yun:}/foreach{/yun}
						<div class="zph_img">
							<div class="zph_imgbox">
								<a href="javascript:addImg()">
									<div class=" "><span class="admin_zph_img_box_tj">+</span></div>
									<div class="zph_img_bthbox">添加图片</div>
								</a>
							</div>
						</div>
					</div>
     			</form>
     		</div>
     	</div>
     </div>
	</div>
	<div class="clear"></div>
	<div class="subnav" id="addImage" style="display:none">
		<div class="">
			<iframe id="supportiframe"  name="supportiframe" onload="returnmessage('supportiframe');" style="display:none"></iframe>
			<form name="myform" target="supportiframe" action="index.php?m=company_order&c=uploadsave" method="post" encType="multipart/form-data" onsubmit="return ckaddpic()">
				<input class="input-text" name="order_id" type="hidden" value="{yun:}$row.id{/yun}" />
				<input type="hidden" name="pytoken" id="pytoken"  value="{yun:}$pytoken{/yun}">
				<div class="zph_tjlist"><em class="zph_tjlist_s">上传图片：</em>
					<button type="button" class="yun_bth_pic noupload" lay-data="{parentid: 'img_container',uploadmulti:'1', url: 'index.php?m=company_order&c=multiupload'}" style="vertical-align:top">选择图片</button>
					<input type="hidden" id="laynoupload" value="1"/>
					<input type="hidden" id="uploadmulti" value="1"/>
					<div class="clear"></div>
					<div id="img_container" class="none"></div>
				</div>
 				<div class="zph_tjlist">
				<input class="preview_multi_tj" type="submit" name="add" value="添加" style="margin-left:0px;">
				</div>
			</form>
		</div>
	</div>
</div>
<script>
    layui.use('layer', function() {
        var layer = layui.layer;
        layer.photos({
            photos: '#myform'
        });
    });
	function imghidden($this){
		$($this).each(function(){
			$(this).parent().parent().find('.ttt').hide();
		});
	}
    function ckaddpic(){
	    if (!$('.addpicurls').length) {
            layer.msg('请上传图片！',2,8);return false;
		}
    }
	function addImg(){
		$.layer({
			type : 1,
			title : '添加图片',
			closeBtn : [0 , true],
			border : [10 , 0.3 , '#000', true],
			area : ['400px','270px'],
			page : {dom :"#addImage"}
		});
	}
</script>
<script src="{yun:}$config.sy_weburl{/yun}/js/layui.upload.js?v={yun:}$config.cachecode{/yun}" type='text/javascript'></script>
</body>
</html>
