<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>

<body>
<div id="crmClassApp" class="moduleElenAl">
    <div class="moduleSeachs">
        <div class="">
            CRM分类
        </div>
        <div class="nrtopbtn">
            <el-button type="primary" icon="el-icon-document-add" size="mini" @click="addVisible = true">添加分类</el-button>
        </div>
    </div>
    <div class="moduleElTable">
        <el-table :data="tableData" stripe border style="width: 100%;" height="100%" :header-cell-style="{ background: '#f5f7fa', color: '#606266' }" ref="multipleTable" @selection-change="handleSelectionChange" v-loading="loading" :empty-text="emptytext">
            <el-table-column type="selection" width="55" :selectable="checkSelectAble"></el-table-column>
            <el-table-column prop="id" label="分类编号" width="180"></el-table-column>
            <el-table-column label="分类名称(点击修改)" property="name">
                <template slot-scope="scope">
                    <el-input v-if="scope.row[scope.column.property + 'isShow']" :ref="scope.column.property + scope.$index" :id="scope.column.property + scope.$index" v-model="scope.row.name" @blur="alterData(scope)"></el-input>
                    <span v-else>
                        一级分类：{{ scope.row.name }}<img @click="editData(scope)" class="editIcon" src="../../../admin/images/bine.png" alt="" style="margin-left: 4px;" width="14" height="14">
                    </span>
                </template>
            </el-table-column>
            <el-table-column prop="variable" label="分类变量名"></el-table-column>
            <el-table-column fixed="right" label="操作" width="140">
                <template slot-scope="scope">
                    <div class="cz_button">
                        <el-button size="mini" @click="openManage(scope)">管理</el-button>
                        <el-button size="mini" type="danger" @click="deleteRow(scope)" v-if="idArr.indexOf(scope.row.id)==-1">删除</el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>
    <div class="modulePaging">
        <div class="">
            <div class="modulecz modulePagButn">
                <el-checkbox :indeterminate="isIndeterminate" v-model="checked" @change="selectAllBottom">全选</el-checkbox>
                <el-button @click="deleteRow(null, true)" size="mini">批量删除</el-button>
            </div>
        </div>
    </div>
    <el-dialog title="CRM分类" width="40%" :visible.sync="addVisible" :modal-append-to-body="false">
        <class_add :position="tableData" @child-event-getlist="getList"></class_add>
    </el-dialog>
    <!--弹窗：分类管理-->
    <div class="modluDrawer">
        <el-drawer title="分类管理" :visible.sync="manageDrawer" :append-to-body="true" :modal-append-to-body="false" :show-close="true" :with-header="true" size="85%">
            <class_manage :cid="cid"></class_manage>
        </el-drawer>
    </div>
</div>
</body>
<script>
    const crmClassApp = new Vue({
        el: '#crmClassApp',
        data: function () {
            return {
                emptytext: '暂无数据',
                loading: false,
                tableData: [], //表格数据
                checked: false,
                isIndeterminate: false,// checkbox 的不确定状态
                selectedItem: [],
                addVisible: false,
                oldData: null,
                idArr: ['1','2','12','21','22','43'],
                cid: '',
                manageDrawer: false
            }
        },
        components: {
            'class_add': httpVueLoader('./component/classAdd.vue'),
            'class_manage': httpVueLoader('./component/classManage.vue'),
        },
        mounted() {
            this.getList();
        },
        methods: {
            checkSelectAble: function(e){
                let _this = this;
                if (_this.idArr.indexOf(e.id) > -1){
                    return false
                }else{
                    return true;
                }
            },
            handleSelectionChange(val) {
                this.selectedItem = val;
                if (this.selectedItem.length == 0) {
                    this.isIndeterminate = false;
                    this.checked = false;
                } else {
                    if (this.selectedItem.length == this.tableData.length) {
                        this.isIndeterminate = false;
                        this.checked = true;
                    } else {
                        this.isIndeterminate = true;
                        this.checked = false;
                    }
                }
            },
            selectAllBottom(value) {
                value ? this.$refs.multipleTable.toggleAllSelection() : this.$refs.multipleTable.clearSelection();
            },
            getList() {
                this.addVisible = false;
                let _this = this;
                _this.loading = true;
                _this.emptytext = "数据加载中";
                httpPost('m=crm&c=crmClass').then(function (response) {
                    let res = response.data;
                    _this.tableData = res.data;
                    _this.loading = false;
                    if (_this.tableData.length === 0){
                        _this.emptytext = "暂无数据";
                    }
                }).catch(function (error) {
                    console.log(error);
                });
            },
            deleteRow(scope, isMore) {
                let params = {};
                if (isMore) {
                    if (!this.selectedItem.length) {
                        message.error('请选择要删除的数据');
                        return false;
                    }
                    let list = [];
                    for (let item of this.selectedItem) {
                        list.push(item.id);
                    }
                    params.delType = 'more';
                    params.del = list;
                } else {

                    params.delType = 'single';
                    params.delid = scope.row.id;
                }
                delConfirm(this, params, this.delete);
            },
            delete(params) {
                let _this = this;
                httpPost('m=crm&c=crmClass&a=delClass', params).then(function (response) {
                    let res = response.data;
                    if (res.error === 0) {
                        message.success('删除成功！');
                        _this.getList();
                    } else {
                        message.error('删除失败！');
                    }
                }).catch(function (error) {
                    console.log(error);
                });
            },
            editData(scope) {
                let index = scope.$index;
                let row = scope.row;
                let column = scope.column;
                this.oldData = JSON.parse(JSON.stringify(row));
                let copyRow = JSON.parse(JSON.stringify(row));
                copyRow[column.property + "isShow"] = true;
                this.$set(this.tableData, index, copyRow);
                this.$nextTick(() => {
                    let ref = column.property + index;
                    $("#" + ref).focus();
                });
            },
            alterData(scope) {
                if (this.oldData == null) {
                    return false;
                }
                let index = scope.$index;
                let row = scope.row;
                let column = scope.column;
                let copyRow = JSON.parse(JSON.stringify(row));
                copyRow[column.property + "isShow"] = false;
                this.$set(this.tableData, index, copyRow);
                if (row[column.property] === this.oldData[column.property]) {
                    return false;
                }
                let _this = this;
                let sendData = {id: row.id};
                sendData[column.property] = row[column.property];
                httpPost('m=crm&c=crmClass&a=ajaxData', sendData, {hideloading: true}).then(function (response) {
                    _this.oldData = null;
                    _this.getList();
                }).catch(function (error) {
                    console.log(error);
                });
            },
            openManage(scope) {
                this.cid = scope.row.id
                this.manageDrawer = true
            }
        }
    });
</script>

</html>
<style>
    .cell span {
        display: flex;
        align-items: center;
    }

    .el-tabs__header {
        display: none !important;
    }

    .el-tabs__content {
        padding: 0;
    }

    .dialog_item {
        margin-top: 25px;
        display: flex;
    }

    .item_span {
        width: 75px;
        text-align: right;
        display: block;
    }

    .editIcon {
        padding-left: 5px;
        cursor: pointer;
    } 
		.el-table .el-table__cell {
	    padding: 12px 0;
	} 
</style>
