<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=utf-8">
		<link href="images/reset.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
		<link href="images/system.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
		<link href="images/table_form.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
		<script src="{yun:}$config.sy_weburl{/yun}/js/jquery-1.8.0.min.js?v={yun:}$config.cachecode{/yun}"></script>
		<link href="{yun:}$config.sy_weburl{/yun}/js/layui/css/layui.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet"
		 type="text/css" />
		<script src="{yun:}$config.sy_weburl{/yun}/js/layui/layui.js?v={yun:}$config.cachecode{/yun}"></script>
		<script src="{yun:}$config.sy_weburl{/yun}/js/layui/phpyun_layer.js?v={yun:}$config.cachecode{/yun}"></script>
		<script src="js/admin_public.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
		<title>后台管理</title>
	</head>

	<body class="body_ifm">

		<div class="infoboxp">
			<div class="tty-tishi_top">
				<div class="tabs_info">
					<ul>
						
						<li><a href="index.php?m=database">备份数据</a></li>
						<li class="curr"><a href="index.php?m=database&c=backin">已备份数据</a></li>
						<li><a href="index.php?m=database&c=optimizing">优化数据</a></li>
						<li><a href="index.php?m=database&c=clearList">数据清理</a></li>
					</ul> 
				</div>
<div class="tishiTopAllt" style="border-bottom: 0px solid #ECEFF8">
						<div class="tishiTopAlltOne">
							<span>该页面展示了网站数据库信息，可对数据库进行备案还原操作，也可通过其它软件进行操作</span>
						</div>
						<div class="tishiTopAlltTwo">
							<a  href="index.php?m=database">备份数据</a>
						</div>
					</div>
		</div>

				<div class="clear"></div>
				
				<div class="table-list mt10">
					<div class="admin_table_border">

						<iframe id="supportiframe" name="supportiframe" onload="returnmessage('supportiframe');" style="display:none"></iframe>

						<table width="100%">
							<thead>
								<tr class="admin_table_top">
									<th align="left">文件名</th>
									<th align="left">时间</th>
									<th align="left">数据库名称</th>
									<th align="left" class="admin_table_th_bg">操作</th>
								</tr>
							</thead>
								<tbody class="tableBackColorTwo">
								{yun:}foreach item=v from=$sqlarr{/yun}
								<tr align="left">
									<td align="left" class="td1">{yun:}$v.name{/yun}</td>
									<td class="ud" align="left">{yun:}$v.time{/yun}</td>
									<td class="od" align="left">{yun:}$v.dbname{/yun}</td>
									<td><div class="operationSeries">
										<a href="javascript:void(0);" onclick="backin('index.php?m=database&c=backincheck&ver={yun:}$v.version{/yun}&mypath={yun:}$v.name{/yun}')"
										 class="">恢复</a>
										<a href="javascript:void(0)" onclick="layer_del('确定要删除？', 'index.php?m=database&c=del&sql={yun:}$v.name{/yun}');"
										 class="  ">删除</a>
										 </div>
									</td>
								</tr>
								{yun:}foreachelse{/yun}
								<tr>
									<td colspan="4">
										<div class="admin_newnotip">暂无备份数据</div>
									<div class="admin_newnotipbth"><a href="index.php?m=database">备份数据</a></div>
									</td>
								</tr>
								{yun:}/foreach{/yun}
							</tbody>
							
						</table>
					</div>
				</div>
			</div>
		</div>

		<input type="hidden" name="pytoken" id='pytoken' value="{yun:}$pytoken{/yun}">

		<script>
			function backin(url) {
				var pytoken = $('#pytoken').val();
				parent.layer.confirm("确定导入数据？", function() {
					parent.layer.closeAll();
					location.href = url + '&pytoken=' + pytoken;
				});
			}
		</script>
	</body>
</html>
