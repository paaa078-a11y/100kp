<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>

<body>
    <div id="moduapp" class="moduleDome">
        <div class="setDomeAll setDomeInte">
            <el-tabs v-model="activeName" @tab-click="handleClick">
                <el-tab-pane label="行为轨迹记录" name="first">
                    <behavior></behavior>
                </el-tab-pane>
                <el-tab-pane label="行为轨迹设置" name="second">
                    <behaviorset v-if="activeName == 'second'"></behaviorset>
                </el-tab-pane>
            </el-tabs>
        </div>
    </div>
    <!-- script -->
    <script>
    const custoapp = new Vue({
        el: '#moduapp',
        data: function() {
            return {
                activeName: 'first'
            }
        },
        components: {
            'behavior': httpVueLoader('./component/behavior.vue'),
            'behaviorset': httpVueLoader('./component/behaviorset.vue'),
        },
        methods: {
            handleClick(tab, event) {
                console.log(tab, event);
            }
        }
    });
    </script>
</body>

</html>
