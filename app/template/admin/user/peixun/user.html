<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
    <link rel="stylesheet" href="../../../admin/js/wangeditor/index.css">
    <script src="../../../admin/js/wangeditor/index.js"></script>
</head>

<body>
    <div id="moduapp" class="moduleDome">
        <div class="setDomeAll setDomeInte">
            <el-tabs v-model="activeName" @tab-click="handleClick">
                <el-tab-pane label="培训用户" name="member">
                    <member ref="member" :status="status"></member>
                </el-tab-pane>
                <el-tab-pane label="解绑记录" name="unbindinglog" lazy>
                    <unbindinglog ref="unbindinglog"></unbindinglog>
                </el-tab-pane>
                <el-tab-pane label="培训日志" name="log" lazy>
                    <log ref="log" :uid="uid"></log>
                </el-tab-pane>
            </el-tabs>
        </div>
    </div>
    <!-- script -->
    <script>
    const custoapp = new Vue({
        el: '#moduapp',
        data: function() {
            return {
                activeName: 'member',
                status: '',
                uid: ''
            }
        },
        components: {
            'member': httpVueLoader('./component/member.vue'),
            'unbindinglog': httpVueLoader('./component/member_unbinding_log.vue'),
            'log': httpVueLoader('./component/member_log.vue'),
        },
        created: function () {
            var that = this
            let query = window.parent.homeapp.$route.query;
            if (query.status) {
                that.status = query.status;
            }
            if (query.tabs) {
                that.activeName = query.tabs;
            }
        },
        methods: {
            handleClick(tab, event) {
                // this.$refs[tab.name].init();
            }
        }
    });
    </script>
</body>

</html>
