<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
    <link rel="stylesheet" href="../../../admin/js/wangeditor/index.css">
    <script src="../../../admin/js/wangeditor/index.js"></script>
</head>

<body>
<div id="daohaapp" class="moduleElenAl">
    <div class="moduleSeachs">
        <div class="moduleElTabInpt">
            <div class="moduleInptList">
                <el-input placeholder="输入你要搜索的关键字" @keyup.enter.native="search" size="small" v-model="searchForm.keyword" clearable class="input-with-select">
                    <el-select v-model="searchForm.type" slot="prepend" placeholder="请选择">
                        <el-option label="机构名称" :value="1"></el-option>
                        <el-option label="新闻标题" :value="2"></el-option>
                    </el-select>
                </el-input>
            </div>
            <div v-for="(searchItem, searchIndex) in searchList" class="moduleInptList">
                <el-select size="small" v-model="searchForm[searchItem.param]" slot="prepend" :clearable="true" :placeholder="searchItem.name" @change="search">
                    <el-option v-for="(searchLabel, searchValue) in searchItem.value" :label="searchLabel" :value="searchValue"></el-option>
                </el-select>
            </div>
            <div class="moduleInptList">
                <el-button type="primary" icon="el-icon-search" size="mini" @click="search">查询</el-button>
            </div>
        </div>
    </div>
    <div class="moduleElTable">
        <el-table :data="list" border style="width: 100%" ref="multipleTable" @selection-change="handleSelectionChange"
                  @sort-change="sortChange"
                  :header-cell-style="{background:'#f5f7fa',color:'#606266'}" height="100%" v-loading="loading">
            <template slot="empty">
                <p>{{dataText}}</p>
            </template>
            <el-table-column type="selection" width="55">
            </el-table-column>
            <el-table-column prop="id" label="编号" width="80" sortable="custom">
            </el-table-column>
            <el-table-column label="机构名称">
                <template slot-scope="scope">
                    <el-link :underline="false" type="primary" @click="openPage(scope.row.train_url)">{{scope.row.name}}</el-link>
                </template>
            </el-table-column>
            <el-table-column label="新闻标题">
                <template slot-scope="scope">
                    <el-link :underline="false" type="primary" @click="openPage(scope.row.news_url)">{{scope.row.title}}</el-link>
                </template>
            </el-table-column>
            <el-table-column label="状态" width="140">
                <template slot-scope="scope">
                    <div class="admin_state">
                        <span v-if="scope.row.status == 1" class="admin_state1">已审核</span>
                        <span v-else-if="scope.row.status == 2" class="admin_state2">未通过</span>
                        <span v-else class="admin_state5">未审核</span>
                    </div>
                </template>
            </el-table-column>
            <el-table-column fixed="right" label="操作" width="200">
                <template slot-scope="scope">
                    <div class="moduleElTaCaoz">
                        <el-button size="mini" @click="openAudit(scope.row)">审核</el-button>
                        <el-button size="mini" @click="openPage(scope.row.news_url)">预览</el-button>
                        <el-button size="mini" @click="del(scope.$index)" type="danger">删除</el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>
    <div class="modulePaging">
        <div class="modulecz">
            <el-checkbox v-model="checkedAll" :indeterminate="checkedAllIndeterminate"
                         @change="checkAll">全选</el-checkbox>
            <el-button @click="batch('del')" size="mini">批量删除</el-button>
            <el-button @click="batch('audit')" size="mini">批量审核</el-button>
        </div>
        <div class="modulePagNum">
            <div class="modulePagNum" style="margin: 0 auto;">
                <el-pagination background @size-change="handleSizeChange" @current-change="handleCurrentChange"
                               :current-page="page" :page-sizes="pageSizes" :page-size="limit"
                               layout="total, sizes, prev, pager, next, jumper" :total="total">
                </el-pagination>
            </div>
        </div>
    </div>
    <!-- 弹窗 -->
    <div class="modluDrawer">
        <el-dialog title="新闻审核" :visible.sync="dialogAudit" :with-header="true" :modal-append-to-body="false"
                   :show-close="true" width="500px">
            <div class="toolClasDia fenpeizhand" v-if="detail.id && detail.r_status != 1">
                <div class="toolClasList">
                    <div class="toolClasTite">
                        <span>培训机构：</span>
                    </div>
                    <div class="toolClasCont">
                        {{detail.name}}
                        <span v-if="detail.r_status == 0" style="color: red">【未审核】</span>
                        <span v-else-if="detail.r_status == 3" style="color: red">【未通过】</span>
                    </div>
                </div>
                <div class="toolClasList">
                    <div class="toolClasTite">
                        <span>讲师审核：</span>
                    </div>
                    <div class="toolClasCont">
                        <el-radio v-model="ruleFormAudit.r_status" label="1">正常</el-radio>
                        <el-radio v-model="ruleFormAudit.r_status" label="3">未通过</el-radio>
                    </div>
                </div>
                <div class="toolClasList">
                    <div class="toolClasTite">
                        <span>机构审核：</span>
                    </div>
                    <div class="toolClasCont">
                        <el-checkbox v-model="ruleFormAudit.istb" disabled :true-label="1" :false-label="0">同步</el-checkbox>
                    </div>
                </div>
                <div class="toolClasList">
                    <div class="toolClasTite">
                        <span>同步说明：</span>
                    </div>
                    <div class="toolClasCont">
                        <el-alert title="培训机构身份状态根据新闻状态同步审核" type="info" :closable="false" show-icon>
                        </el-alert>
                    </div>
                </div>
                <div class="toolClasList">
                    <div class="toolClasTite">
                        <span>审核说明：</span>
                    </div>
                    <div class="toolClasCont">
                        <el-input type="textarea" :rows="2" placeholder="请输入内容" v-model="ruleFormAudit.statusbody">
                        </el-input>
                    </div>
                </div>
            </div>
            <div class="toolClasDia fenpeizhand" v-else>
                <div class="toolClasList">
                    <div class="toolClasTite">
                        <span>审核操作：</span>
                    </div>
                    <div class="toolClasCont">
                        <el-radio v-model="ruleFormAudit.status" label="1">正常</el-radio>
                        <el-radio v-model="ruleFormAudit.status" label="2">未通过</el-radio>
                    </div>
                </div>
                <div class="toolClasList">
                    <div class="toolClasTite">
                        <span>审核说明：</span>
                    </div>
                    <div class="toolClasCont">
                        <el-input type="textarea" :rows="2" placeholder="请输入内容" v-model="ruleFormAudit.statusbody">
                        </el-input>
                    </div>
                </div>
            </div>
            <span slot="footer" class="dialog-footer">
                    <el-button @click="dialogAudit = false">取 消</el-button>
                    <el-button type="primary" @click="saveAudit">确 定</el-button>
                </span>
        </el-dialog>
    </div>
</div>
<!-- script -->
<script>
    const custoapp = new Vue({
        el: '#daohaapp',
        data: function () {
            return {
                loading: false,
                dataText: '数据加载中',
                // 搜索筛选项
                searchList: [],
                searchForm: {
                    type: 1
                },

                // 列表
                page: 1,
                limit: 0,
                list: [],
                total: 0,
                pageSizes: [],

                // 列表排序
                t: '',
                order: '',

                checkedAll: false, // 全选
                checkedAllIndeterminate: false,
                multipleSelection: [], // 多选值存储
                idArr: [],

                detail: {},

                teachStatusNum1: 0,
                teachStatusNum2: 0,
                teacherAllNum: 0,

                saveLoading: false,

                // 审核
                dialogAudit: false,
                ruleFormAudit: {},

                prevPage: 0
            }
        },
        created() {
            var that = this
            let query = window.parent.homeapp.$route.query;
            if (query.status) {
                that.searchForm.status = query.status;
            }

            this.getList();
        },
        mounted() {
            var that = this
            setTimeout(function () {
                that.getSearchFun();
            }, 200)
        },
        methods: {
            getSearchFun:function(){
                let that = this;
                httpPost('m=user&c=peixun_news&a=getSearchData', {},{hideloading: true}).then(function (response) {
                    let res = response.data;
                    if (res.error == 0) {
                        that.searchList = res.data.search_list;
                    }
                })
            },
            handleSizeChange(val) {
                this.limit = val;
                this.getList();
            },
            handleCurrentChange(val) {
                this.page = val;
                this.getList();
            },
            sortChange(event) {
                this.t = event.order ? event.prop : '';
                this.order = event.order ? event.order == 'descending' ? 'desc' : 'asc' : '';
                this.search();
            },
            search() {
                this.page = 1;
                this.getList();
            },
            getList() {
                let that = this,
                    searchForm = that.searchForm,
                    params = {
                        page: that.page,
                        limit: that.limit,
                        t: that.t,
                        order: that.order,
                    };
                    that.loading = true;

                httpPost('m=user&c=peixun_news', { ...params, ...searchForm }, {hideloading: true}).then(function (response) {
                    let res = response.data,
                        data = res.data;

                    that.list = data.list;
                    that.total = parseInt(data.total);
                    that.pageSizes = data.page_sizes;
                    if (that.limit === 0) {
                        that.limit = parseInt(data.limit); // 取系统配置默认数量
                    }
                    if (that.page > data.page) {
                        that.page = parseInt(data.page); // 最后一页被删除后，取最新的页数
                    }
                    that.loading = false;
                    if(that.prevPage != that.page){
                        that.prevPage = that.page;
                        that.$refs.multipleTable.bodyWrapper.scrollTop = 0;
                    }
                    if (that.list.length === 0) {
                        that.dataText = "暂无数据";
                    }
                })
            },

            // 批量操作
            handleSelectionChange(val) {
                if (val.length == 0) {
                    this.checkedAll = false;
                    this.checkedAllIndeterminate = false;
                } else {
                    if (val.length === this.list.length) {
                        this.checkedAll = true;
                        this.checkedAllIndeterminate = false;
                    } else {
                        this.checkedAll = false;
                        this.checkedAllIndeterminate = true;
                    }
                }
                this.multipleSelection = val;
            },
            batch(type) {
                if (this.multipleSelection.length == 0 && type == 'del') {
                    message.error('请选择要删除的数据');
                    return false;
                }else if (this.multipleSelection.length == 0){
                    message.error('请选择要操作的数据项');
                    return false;
                }

                let idArr = [];
                this.multipleSelection.forEach(function (item) {
                    idArr.push(item.id);
                })
                this.idArr = idArr;

                if (type == 'del') {
                    this.del();
                } else if (type == 'audit') {
                    this.openAudit();
                }
            },
            checkAll(val) {
                val ? this.checkedAllIndeterminate = false : '';
                this.$refs.multipleTable.toggleAllSelection();
            },

            del(idx) {
                let that = this,
                    params = {},
                    msg = '';

                if (typeof idx == 'undefined') { // 批量删除
                    params.del = this.idArr;
                    msg = '你确定要删除选中项吗？';
                } else {// 单个删除
                    params.del = that.list[idx].id;
                    msg = '你确定要删除当前项吗？';
                }

                delConfirm(this, params, function (params) {
                    httpPost('m=user&c=peixun_news&a=del', params).then(function(res) {
                        if (res.data.error > 0) {
                            message.error(res.data.msg);
                        } else {
                            that.getList();
                            that.$refs.multipleTable.clearSelection();
                            message.success(res.data.msg);
                        }
                    })
                }, msg)
            },

            openAudit(row) {
                let that = this;

                if (typeof row != 'undefined') { // 单个审核
                    that.detail = row;
                    if (row.r_status != 1) {
                        if (row.r_status == 2) {
                            message.error('用户已锁定,无法审核相关信息');
                            return false;
                        }

                        that.ruleFormAudit = {
                            id: row.id,
                            uid: row.uid,
                            r_status: row.r_status,
                            istb: 1,
                            statusbody: row.statusbody,
                        };
                    } else {
                        that.ruleFormAudit = {
                            id: row.id,
                            status: row.status,
                            statusbody: row.statusbody,
                        };
                    }
                } else { // 批量审核
                    that.detail = {};
                    that.ruleFormAudit = {
                        id: this.idArr,
                        status: '',
                        statusbody: '',
                    };
                }
                that.dialogAudit = true;
            },

            saveAudit() {
                let that = this,
                    params = that.ruleFormAudit,
                    url = 'm=user&c=peixun_news&a=status';

                if (typeof that.detail.r_status !== 'undefined' && that.detail.r_status != 1) { // 账号同步审核
                    url = 'm=user&c=peixun_news&a=newstatus';
                    if (typeof params.r_status == 'undefined' || params.r_status === '' || params.r_status === '0') {
                        message.error('请选择审核状态');
                        return false;
                    }
                } else {
                    if (typeof params.status == 'undefined' || params.status === '' || params.status === '0') {
                        message.error('请选择审核状态');
                        return false;
                    }
                }

                if (that.saveLoading) {
                    return false;
                }
                that.saveLoading = true;

                httpPost(url, params).then(function(res) {
                    that.saveLoading = false;

                    if (res.data.error > 0) {
                        message.error(res.data.msg);
                    } else {
                        that.dialogAudit = false;
                        that.getList();
                        message.success(res.data.msg, function () {
                            that.$refs.multipleTable.clearSelection();
                        });
                    }
                })
            },

            openPage(url) {
                window.open(url);
            },
        }
    });
</script>
</body>

</html>
