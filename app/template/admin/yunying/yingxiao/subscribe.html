<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>

<body>
<div id="daohaapp" class="moduleElenAl">

    <div class="moduleElTable" style="height: calc(100% - (5px + 40px + 12px + 12px)); margin-top: 0;">
        <el-table :data="list" border style="width: 100%" ref="multipleTable" @selection-change="handleSelectionChange"
                  :header-cell-style="{background:'#f5f7fa',color:'#606266'}" height="100%" v-loading="loading">
            <template slot="empty">
                <p>{{dataText}}</p>
            </template>
            <el-table-column type="selection" width="55">
            </el-table-column>
            <el-table-column prop="id" label="ID" width="80">
            </el-table-column>
            <el-table-column prop="uname" label="订阅用户" width="200">
            </el-table-column>
            <el-table-column label="发送周期" width="130">
                <template slot-scope="scope">
                    {{scope.row.time}}天
                </template>
            </el-table-column>
            <el-table-column label="订阅类型" width="130">
                <template slot-scope="scope">
                    <span v-if="scope.row.type == 1">订阅职位</span>
                    <span v-else>订阅简历</span>
                </template>
            </el-table-column>
            <el-table-column prop="city_name" label="工作地点" width="200">
            </el-table-column>
            <el-table-column prop="jobname" label="职位类别" min-width="220">
            </el-table-column>
            <el-table-column prop="salary" label="月薪范围" width="130">
            </el-table-column>
            <el-table-column prop="ctime_n" label="订阅时间" width="160">
            </el-table-column>
            <el-table-column fixed="right" label="操作" width="140" align="center">
                <template slot-scope="scope">
                    <div class="cz_button">
                        <el-button type=" " size="small " @click="openRecord(scope.row)">记录</el-button>
                        <el-button type="danger" size="small " @click="del(scope.$index)">删除</el-button>
                    </div>
                </template>
            </el-table-column>

        </el-table>
    </div>
    <div class="modulePaging">
        <div class="modulecz modulePagButn">
            <el-checkbox v-model="checkedAll" :indeterminate="checkedAllIndeterminate" @change="checkAll">全选</el-checkbox>
            <el-button @click="batch('del')">批量删除</el-button>
        </div>
        <div class="modulePagNum">
            <el-pagination background @size-change="handleSizeChange" @current-change="handleCurrentChange"
                           :current-page="page" :page-sizes="pageSizes" :page-size="limit"
                           layout="total, sizes, prev, pager, next, jumper" :total="total">
            </el-pagination>
        </div>
    </div>
    <div class="modluDrawer">
        <el-drawer title="发送记录" :visible.sync="drawerRecord" :show-close="true" append-to-body
                   :with-header="true" size="70%">
            <record :id="id" @child-event="closeRecord"></record>
        </el-drawer>
    </div>
</div>
<!-- script -->
<script>
    const custoapp = new Vue({
        el: '#daohaapp',
        data: function () {
            return {
                loading: false,
                dataText: '数据加载中',
                // 搜索筛选项
                searchList: [],
                searchForm: {},

                // 列表
                page: 1,
                limit: 0,
                list: [],
                total: 0,
                pageSizes: [],

                checkedAll: false, // 全选
                checkedAllIndeterminate: false,
                multipleSelection: [], // 多选值存储
                idArr: [],

                id: 0,

                // 发送记录
                drawerRecord: false,
                prevPage:0
            }
        },
        components: {
            'record': httpVueLoader('./component/subscribe_record.vue'),
        },
        created: function () {
            this.getList();
        },
        methods: {
            handleSizeChange(val) {
                this.limit = val;
                this.getList();
            },
            handleCurrentChange(val) {
                this.page = val;
                this.getList();
            },
            search() {
                this.page = 1;
                this.getList();
            },
            getList() {
                let that = this,
                    searchForm = that.searchForm,
                    params = {
                        page: that.page,
                        limit: that.limit,
                    };
                that.loading = true;
                httpPost('m=yunying&c=yingxiao_subscribe', {...params, ...searchForm}, {hideloading: true}).then(function (response) {
                    let res = response.data,
                        data = res.data;

                    that.list = data.list;
                    that.total = parseInt(data.total);
                    that.pageSizes = data.page_sizes;
                    if (that.limit === 0) {
                        that.limit = parseInt(data.limit); // 取系统配置默认数量
                    }
                    if (that.page > data.page) {
                        that.page = parseInt(data.page); // 最后一页被删除后，取最新的页数
                    }
                    if(that.prevPage != that.page){
                        that.prevPage = that.page;
                        that.$refs.multipleTable.bodyWrapper.scrollTop = 0;
                    }
                    that.loading = false;
                    if (that.list.length === 0) {
                        that.dataText = "暂无数据";
                    }
                })
            },

            // 批量操作
            handleSelectionChange(val) {
                if (val.length == 0) {
                    this.checkedAll = false;
                    this.checkedAllIndeterminate = false;
                } else {
                    if (val.length === this.list.length) {
                        this.checkedAll = true;
                        this.checkedAllIndeterminate = false;
                    } else {
                        this.checkedAll = false;
                        this.checkedAllIndeterminate = true;
                    }
                }
                this.multipleSelection = val;
            },
            batch(type) {
                if (this.multipleSelection.length == 0) {
                    message.error('请选择要删除的数据');
                    return false;
                }

                let idArr = [];
                this.multipleSelection.forEach(function (item) {
                    idArr.push(item.id);
                })
                this.idArr = idArr;

                if (type == 'del') {
                    this.del();
                }
            },
            checkAll(val) {
                val ? this.checkedAllIndeterminate = false : '';
                this.$refs.multipleTable.toggleAllSelection();
            },

            del(idx) {
                let that = this,
                    params = {},
                    msg = '';

                if (typeof idx == 'undefined') { // 批量删除
                    params.del = this.idArr;
                    msg = '你确定要删除选中项吗？';
                } else {// 单个删除
                    params.del = that.list[idx].id;
                    msg = '你确定要删除当前项吗？';
                }

                delConfirm(this, params, function (params) {
                    httpPost('m=yunying&c=yingxiao_subscribe&a=del', params).then(function (res) {
                        if (res.data.error > 0) {
                            message.error(res.data.msg);
                        } else {
                            message.success(res.data.msg, function () {
                                that.$refs.multipleTable.clearSelection();
                                that.getList();
                            });
                        }
                    })
                }, msg)
            },

            // 打开发送记录
            openRecord(data) {
                this.id = data.id
                this.drawerRecord = true;
            },

            closeRecord() {
                this.drawerRecord = false;
            },
        }
    });
</script>
</body>

</html>
