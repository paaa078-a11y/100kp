<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>

<body>
<div id="daohaapp" class="moduleElenAl">
    <div class="moduleSeachs" style="padding: 12px;">
        <div class="moduleSeachInpt">
            <el-input v-model="keyword" placeholder="请输入活码名称关键字" size="small" clearable></el-input>
            <el-button type="primary" icon="el-icon-search" size="mini" @click="search">查询</el-button>
        </div>
        <div class="moduleSeachButn" style="display: flex;align-items: center;">
            <el-button type="primary" icon="el-icon-document-add" size="mini" @click="add({id: ''})">新建渠道码</el-button>
        </div>
    </div>
    <div class="moduleElTable">
        <el-table :data="tableData" border style="width: 100%" ref="multipleTable"
                  :header-cell-style="{background:'#f5f7fa',color:'#606266'}" height="100%" v-loading="loading">
            <template slot="empty">
                <p>{{dataText}}</p>
            </template>
            <el-table-column prop="id" label="ID" width="120">
            </el-table-column>
            <el-table-column prop="name" label="渠道码名称" min-width="240">
            </el-table-column>
            <el-table-column prop="create_time_n" label="创建时间" width="200">
            </el-table-column>
            <el-table-column prop="num" label="新增客户" width="150">
            </el-table-column>
            <el-table-column prop="dnum" label="流失客户" width="160">
            </el-table-column>
            <el-table-column fixed="right" label="操作" width="300" align="center">
                <template slot-scope="scope">
                    <div class="cz_button">
                        <el-button type=" " size="small" @click="setstate(scope.row.state)">数据</el-button>
                        <el-button type=" " size="small" @click="add(scope.row)">编辑</el-button>
                        <el-button type="danger" size="small" @click="delrow(scope.row.id)">删除</el-button>
                        <el-button size="small" @click="previewimg(scope.row.qr_code)">查看</el-button>
                        <el-button size="small" @click="downCode(scope.row.qr_code, scope.row.name)">下载</el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>
    <div class="modulePaging">
        <div></div>
        <div class="modulePagNum">
            <el-pagination background @size-change="handleSizeChange" @current-change="handleCurrentChange"
                           :current-page="currentPage" :page-sizes="pageSizes" :page-size="perPage"
                           layout="total, sizes, prev, pager, next, jumper" :total="total">
            </el-pagination>
        </div>
    </div>
    <!--编辑-->
    <div class="modluDrawer">
        <el-dialog :title="dtl.id ? '编辑渠道码' : '新建渠道码'" :visible.sync="draweradd" :with-header="true" :modal-append-to-body="false"
                   :show-close="true" width="40%">
            <p style="font-weight: bolder;margin-bottom: 5px;">配置客户联系「联系我」方式 —— 客户渠道码</p>
            <div>1、使用人员需要配置了客户联系功能</div>
            <div>2、配置的使用成员必须在企业微信激活且已经过实名认证。</div>
			<div class="drawerModLis"style="padding-top:20px;">
            <div class="drawerModTite ">渠道码名称</div>
            <div class="drawerModInpt"><el-input v-model="dtl.name" placeholder="请输入渠道码名称"></el-input> </div>
            </div>
			<div class="drawerModLis">
			<div class="drawerModTite ">方式类型</div>
            <div class="drawerModInpt">
                <el-radio-group v-model="dtl.type" :disabled="dtl.id ? true : false" @input="singlemulti">
                    <el-radio label="1">单人</el-radio>
                    <el-radio label="2">多人</el-radio>
                </el-radio-group>
            </div>
			  </div>
            <div class="drawerModLis">
            <div class="drawerModTite ">联系备注</div>
            <div class="drawerModInpt"> <el-input v-model="dtl.remark" placeholder="请填写联系备注信息"></el-input>
            </div>
			  </div>
            <div class="drawerModLis">
            <div class="drawerModTite ">好友验证</div>
             <div class="drawerModInpt">
                <el-switch v-model="dtl.skip_verify" active-color="#13ce66" inactive-color="#ff4949">
                </el-switch>
            </div>
			  </div>
          <div class="drawerModLis">
          <div class="drawerModTite ">选择员工</div>
             <div class="drawerModInpt">
                <el-select v-model="seluser" :key="selkey" filterable :multiple="multiple" placeholder="请选择">
                    <el-option v-for="(item,index) in userarr" :key="index" :label="item.label" :value="item.value"></el-option>
                </el-select>
            </div>
			  </div>
			   <div class=" " style=" text-align:right;padding-bottom:15px;padding-top:20px;">
            <span slot="footer" class="dialog-footer">
	               <el-button @click="draweradd = false">取 消</el-button>
	               <el-button type="primary" @click="save" :disabled="saveLoading">确 定</el-button>
	           </span>  </div>
        </el-dialog>
    </div>
    <!-- 二维码预览弹窗 -->
    <div class="tck_setbox">
        <el-dialog title="入群二维码" :visible.sync="showqrcode" :with-header="true" :modal-append-to-body="false"
                   :show-close="true" width="300px">
            <div id="qyQrCode" class="code_img" style="display:flex;justify-content: center;margin-bottom: 15px;">
                <img :src="previewqrcode" width="200" height="200">
            </div>
        </el-dialog>
    </div>
    <!-- 数据弹窗 -->
    <el-drawer title="渠道码数据统计" :visible.sync="tjdrawer" :direction="direction" :modal-append-to-body="false"
               size="80%">
        <div class="qudaoDomeAll">
            <div class="moduleSeachs">
                <div class="tableSeachInpt tableSeachInptsmall">
                    <el-date-picker v-model="time" size="small" type="daterange" range-separator="至"
                                    start-placeholder="开始日期" end-placeholder="结束日期" value-format="yyyy-MM-dd"
                                    style="margin-right: 10px; text-align: left;" @change="analyse">
                    </el-date-picker>
                    <el-button type="primary" icon="el-icon-search" size="mini" @click="analyse">查询</el-button>
                    <el-radio-group v-model="time_type" style="margin-left: 20px;" @input="time_type_change">
                        <el-radio label="0">今日</el-radio>
                        <el-radio label="1">昨日</el-radio>
                        <el-radio label="7">7天内</el-radio>
                        <el-radio label="30">30天内</el-radio>
                    </el-radio-group>
                </div>
            </div>
            <div class="nstatisBoxProfit">
                <div class="com_pay_balance">
                    <div class="com_pay_balance_data_q">
                        <div class="balanceFlex">
                            <div class="com_pay_balance_data_name">今日入群</div>
                            <div class="com_pay_balance_data_n">
                                <strong>{{inToday}}</strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="com_pay_balance">
                    <div class="com_pay_balance_data_q border_blue">
                        <div class="balanceFlex">
                            <div class="com_pay_balance_data_name">今日退群</div>
                            <div class="com_pay_balance_data_n color_blue">
                                <strong>{{outToday}}</strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="com_pay_balance">
                    <div class="com_pay_balance_data_q">
                        <div class="balanceFlex">
                            <div class="com_pay_balance_data_name">总入群数</div>
                            <div class="com_pay_balance_data_n">
                                <strong>{{inAll}}</strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="com_pay_balance">
                    <div class="com_pay_balance_data_q border_blue">
                        <div class="balanceFlex">
                            <div class="com_pay_balance_data_name">总退群数</div>
                            <div class="com_pay_balance_data_n color_blue">
                                <strong>{{outAll}}</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="dataEchatInfo">
                <div class="dataEchatModul" ref="chart"></div>
            </div>
        </div>
    </el-drawer>
</div>
<!-- script -->
<script>
    const custoapp = new Vue({
        el: '#daohaapp',
        data: function () {
            return {
                loading: false,
                dataText: '数据加载中',
                saveLoading: false,

                tjdrawer: false,
                direction: 'rtl',
                tableData: [],
                currentPage: 1,
                perPage: 0,
                pageSizes: [],
                total: 0,
                keyword: '',
                time: ['', ''],
                inToday: '0',
                outToday: '0',
                inAll: '0',
                outAll: '0',
                time_type: '30',
                currstate: '',
                names: [],
                values: [],
                draweradd: false,
                dtl: {id:''},
                previewqrcode: '',
                showqrcode: false,
                userarr: [],
                multiple: false,
                seluser: '',
                selkey: '',
                islook: false,
                prevPage:0
            }
        },
        components: {
            // 'navxiugai': httpVueLoader('./component/navxiugai.vue'),
        },
        created: function () {
            let query = getUrlParams();
            if (query && query.keyword) {
                this.keyword = query.keyword;
            }
            this.getList()
        },
        computed: {
            // multisel:function(){
            //     return this.dtl.type == '2'
            // }
        },
        methods: {
            singlemulti(val){
                this.selkey = Math.random()
                if (val == '1') {// 单选
                    this.multiple = false
                    this.seluser = ''
                } else {// 多选
                    this.multiple = true
                    this.seluser = []
                }
            },
            downCode(url,name) {
                let image = new Image()
                image.setAttribute('crossOrigin', 'anonymous')
                image.src = url
                image.onload = () => {
                    let canvas = document.createElement('canvas')
                    canvas.width = image.width
                    canvas.height = image.height
                    let ctx = canvas.getContext('2d')
                    ctx.drawImage(image, 0, 0, image.width, image.height)
                    canvas.toBlob((blob) => {
                        let url = URL.createObjectURL(blob)
                        download(url,name)
                        // 用完释放URL对象
                        URL.revokeObjectURL(url)
                    })
                }
                function download(href, name) {
                    let eleLink = document.createElement('a')
                    eleLink.download = name
                    eleLink.href = href
                    eleLink.click()
                    eleLink.remove()
                }
            },
            previewimg(img){
                this.previewqrcode = img
                this.showqrcode = true
            },
            add(row){
                this.draweradd = true
                this.selkey = Math.random()
                if (row.id) {
                    this.dtl = row
                    this.dtl.skip_verify = row.skip_verify == '1'
                    this.seluser
                    if (this.dtl.type == '1') {
                        this.seluser = this.dtl.user
                        this.multiple = false
                    } else {
                        this.seluser = this.dtl.user_arr
                        this.multiple = true
                    }
                } else {
                    this.seluser = ''
                    this.dtl = {id: '', skip_verify: true, type: '1'}
                }
                this.getWorkUser()
            },
            setstate(state){
                this.currstate = state
                this.time_type_change('30')
            },
            initCharts() {
                var chart = this.$refs.chart
                var myChart = echarts.init(chart);
                var option = {
                    color: ['#39c3d5', '#46a6ff', '#5259F4'],
                    title: {
                        text: '渠道码数据统计',
                        textStyle: {
                            color: '#333',
                            fontWeight: '500',
                            fontSize: '16'
                        }
                    },
                    legend: {
                        left: 'right'
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'shadow'
                        }
                    },
                    grid: {
                        top: '12%',
                        left: '2%',
                        right: '3%',
                        bottom: '4%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: this.names,
                        axisLine: { show: false },
                        axisTick: { show: false },
                        splitLine: {
                            lineStyle: {
                                type: 'dashed',
                                color: '#f3f3f3'
                            },
                            show: true
                        }
                    },
                    yAxis: {
                        type: 'value',
                        axisLine: { show: false },
                        axisTick: { show: false },
                        splitLine: { //网格线
                            lineStyle: {
                                type: 'dashed',
                                color: '#f3f3f3'
                            },
                            show: true
                        }
                    },
                    series: [
                        {
                            name: this.values[0] ? this.values[0].name : '',
                            data: this.values[0] ? this.values[0].data : [],
                            type: this.values[0] ? this.values[0].type : 'line',
                            smooth: true,
                            areaStyle: {}
                        },
                        {
                            name: this.values[1] ? this.values[1].name : '',
                            data: this.values[1] ? this.values[1].data : [],
                            type: this.values[1] ? this.values[1].type : 'line',
                            smooth: true,
                            areaStyle: {}
                        },
                    ]
                };
                myChart.setOption(option);
                setTimeout(function () {
                    window.addEventListener("resize", () => {
                        myChart.resize();
                    });
                }, 200);
            },
            changeTimeRange(diff) {
                let date = new Date()
                // 通过时间戳计算
                let defalutStartTime = date.getTime() - diff * 24 * 3600 * 1000 // 转化为时间戳
                let defalutEndTime = date.getTime()
                if (diff == '1') {// 昨日
                    defalutEndTime = defalutStartTime
                }
                let startDateNs = new Date(defalutStartTime)
                let endDateNs = new Date(defalutEndTime)
                // 月，日 不够10补0
                defalutStartTime = startDateNs.getFullYear() + '-' + ((startDateNs.getMonth() + 1) >= 10 ? (startDateNs.getMonth() + 1) : '0' + (startDateNs.getMonth() + 1)) + '-' + (startDateNs.getDate() >= 10 ? startDateNs.getDate() : '0' + startDateNs.getDate())
                defalutEndTime = endDateNs.getFullYear() + '-' + ((endDateNs.getMonth() + 1) >= 10 ? (endDateNs.getMonth() + 1) : '0' + (endDateNs.getMonth() + 1)) + '-' + (endDateNs.getDate() >= 10 ? endDateNs.getDate() : '0' + endDateNs.getDate())
                return [defalutStartTime, defalutEndTime]
            },
            time_type_change(val) {
                if (val != '') {
                    this.time = this.changeTimeRange(val)
                    this.analyse()
                }
            },
            handleSizeChange(val) {
                this.perPage = val;
                this.getList()
            },
            handleCurrentChange(val) {
                this.currentPage = val;
                this.getList()
            },
            search() {
                this.currentPage = 1;
                this.getList();
            },
            async getList() {
                let that = this;
                let params = {
                    page: that.currentPage,
                    pageSize: that.perPage
                }
                if (that.keyword) {
                    params.keyword = that.keyword
                }
                if (that.scene != '0') {
                    params.scene = that.scene
                }
                that.loading = true;
                httpPost('m=yunying&c=workwx_code&a=index', params, {hideloading: true}).then(function (result) {
                    var res = result.data
                    if (res.error == 0) {
                        that.tableData = res.data.list
                        that.perPage = parseInt(res.data.perPage)
                        that.pageSizes = res.data.pageSizes
                        that.total = parseInt(res.data.total)
                        if(that.prevPage != that.currentPage){
                            that.prevPage = that.currentPage;
                            that.$refs.multipleTable.bodyWrapper.scrollTop = 0;
                        }
                        that.loading = false;
                        if (that.tableData.length === 0) {
                            that.dataText = "暂无数据";
                        }
                    }
                }).catch(function (e) {
                    console.log(e)
                })
            },
            async analyse() {
                let that = this;
                let params = {}
                if (that.currstate) {
                    params.currstate = that.currstate
                }
                if (that.time) {
                    params.time_begin = that.time[0]
                    params.time_end = that.time[1]
                }
                var thirtydays = this.changeTimeRange('30')
                var sevendays = this.changeTimeRange('7')
                var yesterday = this.changeTimeRange('1')
                var today = this.changeTimeRange('0')
                if (this.time[0] != thirtydays[0] && this.time[1] != thirtydays[1] && this.time[0] != sevendays[0] && this.time[1] != sevendays[1] && this.time[0] != yesterday[0] && this.time[1] != yesterday[1] && this.time[0] != today[0] && this.time[1] != today[1]) {
                    this.time_type = ''
                }
                httpPost('m=yunying&c=workwx_code&a=analyse', params).then(function (result) {
                    var res = result.data
                    if (res.error == 0) {
                        that.inToday = res.data.inToday
                        that.outToday = res.data.outToday
                        that.inAll = res.data.inAll
                        that.outAll = res.data.outAll
                        that.names = res.data.names
                        that.values = res.data.values
                        that.tjdrawer = true
                        setTimeout(function () {
                            that.initCharts()
                        }, 500)
                    }
                }).catch(function (e) {
                    console.log(e)
                })
            },
            getWorkUser() {
                let that = this;
                httpPost('m=yunying&c=workwx_code&a=getWorkUser', {}, {hideloading: true}).then(function (result) {
                    var res = result.data
                    if (res.error == 0) {
                        that.userarr = res.data
                    }
                }).catch(function (e) {
                    console.log(e)
                })
            },
            save(){
                var that = this
                if (!that.dtl.name) {
                    that.$message.error('请输入渠道码名称');
                    return false;
                }
                if (!that.seluser) {
                    that.$message.error('请选择员工');
                    return false;
                }

                if (that.saveLoading) {
                    return false;
                }
                that.saveLoading = true;

                that.dtl.user_arr = that.seluser
                httpPost('m=yunying&c=workwx_code&a=save', that.dtl).then(function (result) {
                    var res = result.data
                    if (res.error == 0) {
                        that.draweradd = false
                        that.getList()
                        message.success(res.msg, function() {
                            that.saveLoading = false;
                        })
                    } else {
                        that.saveLoading = false;
                        message.error(res.msg)
                    }
                }).catch(function (e) {
                    console.log(e)
                })
            },
            delrow(id){
                delConfirm(this, id, this.delete);
            },
            async delete(id) {
                let that = this;
                let params= {
                    del: id
                };
                httpPost('m=yunying&c=workwx_code&a=delCode', params).then(function (response) {
                    if (response.data.error == 0) {
                        message.success('操作成功');
                        that.getList();
                    }else{
                        message.error(response.data.msg);
                    }
                }).catch(function (error) {
                    console.log(error);
                })
            },
        }
    });
</script>
</body>

</html>
