<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>

<body>
<div id="daohaapp" class="moduleElenAl">
    <div class="moduleSeachs">
        <div class="moduleSeachleft">
            <div class="moduleSeachInpt" style="margin-right: 12px;">
                <el-input placeholder="请输入你要搜索的关键字" v-model="searchForm.keyword" class="input-with-select"
                          clearable size="small">
                    <el-select v-model="searchForm.type" size="small" slot="prepend" placeholder="">
                        <el-option label="课程名称" :value="1"></el-option>
                        <el-option label="求职者" :value="2"></el-option>
                    </el-select>
                </el-input>
            </div>
            <div class="tableSeachInptsmall newsinput">
                <el-select v-model="searchForm.isread" size="small" slot="prepend"
                           :clearable="true" placeholder="状态" @change="search">
                    <el-option label="已读" value="1"></el-option>
                    <el-option label="未读" value="0"></el-option>
                </el-select>
            </div>

            <div class="newsbtnbox">
                <el-button type="primary" icon="el-icon-search" size="mini" @click="search">查询</el-button>
            </div>
        </div>
    </div>
    <div class="moduleElTable">
        <el-table :data="list" border style="width: 100%" ref="multipleTable" @selection-change="handleSelectionChange"
                  :header-cell-style="{background:'#f5f7fa',color:'#606266'}" height="100%" v-loading="loading">
            <template slot="empty">
                <p>{{dataText}}</p>
            </template>
            <el-table-column type="selection" width="55">
            </el-table-column>
            <el-table-column prop="id" label="ID" width="80">
            </el-table-column>
            <el-table-column prop="skill_name" label="课程名称" min-width="280">
            </el-table-column>
            <el-table-column prop="name" label="报名人" width="140">
            </el-table-column>
            <el-table-column prop="tel" label="报名电话" width="160">
            </el-table-column>
            <el-table-column prop="time_n" label="报名时间" width="230">
            </el-table-column>
            <el-table-column label="状态" width="230">
                <template slot-scope="scope">
                    <div class="admin_state">
                        <span v-if="scope.row.isread == 1" class="admin_state1">已读</span>
                        <span v-else class="admin_state2">未读</span>
                    </div>
                </template>
            </el-table-column>
            <el-table-column fixed="right" label="操作" width="70">
                <template slot-scope="scope">
                    <div class="cz_button">
                        <el-button type="danger" size="small" @click="del(scope.$index)">删除</el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>
    <div class="modulePaging">
        <div class="modulecz modulePagButn">
            <el-checkbox v-model="checkedAll" :indeterminate="checkedAllIndeterminate" @change="checkAll">全选
            </el-checkbox>
            <el-button @click="batch('del')">批量删除</el-button>
        </div>
        <div class="modulePagNum">
            <el-pagination background @size-change="handleSizeChange" @current-change="handleCurrentChange"
                           :current-page="page" :page-sizes="pageSizes" :page-size="limit"
                           layout="total, sizes, prev, pager, next, jumper" :total="total">
            </el-pagination>
        </div>
    </div>
</div>
<!-- script -->
<script>
    const custoapp = new Vue({
        el: '#daohaapp',
        data: function () {
            return {
                loading: false,
                dataText: '数据加载中',

                input3: '',
                select: '',
                value: true,
                value1: '',
                currentPage4: 4,
                drawer: false,
                
                
                // 搜索筛选项
                searchList: [],
                searchForm: {
                    type: 1
                },

                // 列表
                page: 1,
                limit: 0,
                list: [],
                total: 0,
                pageSizes: [],

                checkedAll: false, // 全选
                checkedAllIndeterminate: false,
                multipleSelection: [], // 多选值存储
                idArr: [],
                prevPage:0
            }
        },
        created: function () {
            var that = this
            let query = window.parent.homeapp.$route.query;
            if (query.isread) {
                this.$set(that.searchForm, 'isread', query.isread);
            }

            this.getList();
        },
        methods: {
            handleSizeChange(val) {
                this.limit = val;
                this.getList();
            },
            handleCurrentChange(val) {
                this.page = val;
                this.getList();
            },
            search() {
                this.page = 1;
                this.getList();
            },
            getList() {
                let that = this,
                    searchForm = that.searchForm,
                    params = {
                        page: that.page,
                        limit: that.limit,
                    };
                that.loading = true;
                httpPost('m=yunying&c=skill_bm', {...params, ...searchForm}, {hideloading: true}).then(function (response) {
                    let res = response.data,
                        data = res.data;

                    that.list = data.list;
                    that.total = parseInt(data.total);
                    that.pageSizes = data.page_sizes;
                    if (that.limit === 0) {
                        that.limit = parseInt(data.limit); // 取系统配置默认数量
                    }
                    if (that.page > data.page) {
                        that.page = parseInt(data.page); // 最后一页被删除后，取最新的页数
                    }
                    if(that.prevPage != that.page){
                        that.prevPage = that.page;
                        that.$refs.multipleTable.bodyWrapper.scrollTop = 0;
                    }
                    that.loading = false;
                    if (that.list.length === 0) {
                        that.dataText = "暂无数据";
                    }
                })
            },

            // 批量操作
            handleSelectionChange(val) {
                if (val.length == 0) {
                    this.checkedAll = false;
                    this.checkedAllIndeterminate = false;
                } else {
                    if (val.length === this.list.length) {
                        this.checkedAll = true;
                        this.checkedAllIndeterminate = false;
                    } else {
                        this.checkedAll = false;
                        this.checkedAllIndeterminate = true;
                    }
                }
                this.multipleSelection = val;
            },
            batch(type) {
                if (this.multipleSelection.length == 0) {
                    message.error('请选择要删除的数据');
                    return false;
                }

                let idArr = [];
                this.multipleSelection.forEach(function (item) {
                    idArr.push(item.id);
                })
                this.idArr = idArr;

                if (type == 'del') {
                    this.del();
                }
            },
            checkAll(val) {
                val ? this.checkedAllIndeterminate = false : '';
                this.$refs.multipleTable.toggleAllSelection();
            },

            del(idx) {
                let that = this,
                    params = {},
                    msg = '';

                if (typeof idx == 'undefined') { // 批量删除
                    params.del = this.idArr;
                    msg = '你确定要删除选中项吗？';
                } else {// 单个删除
                    params.del = that.list[idx].id;
                    msg = '你确定要删除当前项吗？';
                }

                delConfirm(this, params, function (params) {
                    httpPost('m=yunying&c=skill_bm&a=del', params).then(function (res) {
                        if (res.data.error > 0) {
                            message.error(res.data.msg);
                        } else {
                            message.success(res.data.msg, function () {
                                that.$refs.multipleTable.clearSelection();
                                that.getList();
                            });
                        }
                    })
                }, msg)
            },
        }
    });
</script>
</body>

</html>
