<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
    <link rel="stylesheet" href="../../../admin/js/wangeditor/index.css">
    <script src="../../../admin/js/wangeditor/index.js"></script>
</head>

<body>
<div id="daohaapp" class="moduleElenAl">
    <div class="moduleSeachs">
        <div class="moduleSeachleft">
            <div class="moduleSeachInpt" style="margin-right: 12px;">
                <el-input placeholder="请输入你要搜索的关键字" v-model="searchForm.keyword" class="input-with-select"
                          clearable size="small">
                    <el-select v-model="searchForm.type" size="small" slot="prepend" placeholder="用户名">
                        <el-option label="标题" :value="1"></el-option>
                    </el-select>
                </el-input>
            </div>
            <div v-for="(searchItem, searchIndex) in searchList" class="tableSeachInptsmall newsinput">
                <el-select v-model="searchForm[searchItem.param]" size="small" slot="prepend" :clearable="true"
                           :placeholder="searchItem.name" @change="search">
                    <el-option v-for="(searchLabel, searchValue) in searchItem.value" :label="searchLabel"
                               :value="searchValue" :key="searchValue"></el-option>
                </el-select>
            </div>

            <div class="newsbtnbox">
                <el-button type="primary" icon="el-icon-search" size="mini" @click="search">查询</el-button>
            </div>
        </div>
        <div class="moduleSeachButn" style="display: flex;align-items: center;">
            <el-button type="primary" icon="el-icon-document-add" size="mini" @click="openAdd('')">添加课程</el-button>
        </div>
    </div>
    <div class="moduleElTable">
        <el-table :data="list" border style="width: 100%" ref="multipleTable" @selection-change="handleSelectionChange"
                  :header-cell-style="{background:'#f5f7fa',color:'#606266'}" height="100%" v-loading="loading">
            <template slot="empty">
                <p>{{dataText}}</p>
            </template>
            <el-table-column type="selection" width="55">
            </el-table-column>
            <el-table-column prop="id" label="ID" width="80">
            </el-table-column>
            <el-table-column prop="title" label="标题" min-width="280">
            </el-table-column>
            <el-table-column prop="price" label="课程价格" width="140">
            </el-table-column>
            <el-table-column prop="telphone" label="手机号" width="160">
            </el-table-column>
            <el-table-column prop="addtime_n" label="发布时间" width="160">
            </el-table-column>
            <el-table-column prop="last_update_n" label="更新时间" width="160">
            </el-table-column>
            <el-table-column fixed="right" label="操作" width="130" align="center">
                <template slot-scope="scope">
                    <div class="cz_button">
                        <el-button size="small" type="" @click="openAdd(scope.row)">修改</el-button>
                        <el-button size="small " @click="del(scope.$index)" type="danger">删除</el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>
    <div class="modulePaging">
        <div class="modulecz modulePagButn">
            <el-checkbox v-model="checkedAll" :indeterminate="checkedAllIndeterminate" @change="checkAll">全选
            </el-checkbox>
            <el-button @click="batch('del')">批量删除</el-button>
        </div>
        <div class="modulePagNum">
            <el-pagination background @size-change="handleSizeChange" @current-change="handleCurrentChange"
                           :current-page="page" :page-sizes="pageSizes" :page-size="limit"
                           layout="total, sizes, prev, pager, next, jumper" :total="total">
            </el-pagination>
        </div>
    </div>
    <div class="modluDrawer">
        <el-drawer :title="id ? '修改课程' : '添加课程'" :visible.sync="drawerAdd" :modal-append-to-body="false"
                   :show-close="true"
                   :with-header="true" size="60%">
            <skilladd :id="id" @child-event="closeAdd"></skilladd>
        </el-drawer>
    </div>
</div>
<!-- script -->
<script>
    const custoapp = new Vue({
        el: '#daohaapp',
        data: function () {
            return {
                loading: false,
                dataText: '数据加载中',
                // 搜索筛选项
                searchList: [],
                searchForm: {
                    type: 1
                },

                // 列表
                page: 1,
                limit: 0,
                list: [],
                total: 0,
                pageSizes: [],

                checkedAll: false, // 全选
                checkedAllIndeterminate: false,
                multipleSelection: [], // 多选值存储
                idArr: [],

                id: 0,

                // 添加/修改弹窗
                drawerAdd: false,
                prevPage:0
            }
        },
        components: {
            'skilladd': httpVueLoader('./component/skilladd.vue'),
        },
        created: function () {
            this.getBaseData();
            this.getList();
        },
        methods: {
            handleSizeChange(val) {
                this.limit = val;
                this.getList();
            },
            handleCurrentChange(val) {
                this.page = val;
                this.getList();
            },
            search() {
                this.page = 1;
                this.getList();
            },
            getList() {
                let that = this,
                    searchForm = that.searchForm,
                    params = {
                        page: that.page,
                        limit: that.limit,
                    };
                that.loading = true;
                httpPost('m=yunying&c=skill', {...params, ...searchForm}, {hideloading: true}).then(function (response) {
                    let res = response.data,
                        data = res.data;

                    that.list = data.list;
                    that.total = parseInt(data.total);
                    that.pageSizes = data.page_sizes;
                    if (that.limit === 0) {
                        that.limit = parseInt(data.limit); // 取系统配置默认数量
                    }
                    if (that.page > data.page) {
                        that.page = parseInt(data.page); // 最后一页被删除后，取最新的页数
                    }
                    if(that.prevPage != that.page){
                        that.prevPage = that.page;
                        that.$refs.multipleTable.bodyWrapper.scrollTop = 0;
                    }
                    that.loading = false;
                    if (that.list.length === 0) {
                        that.dataText = "暂无数据";
                    }
                })
            },
            getBaseData() {
                let _this = this;
                httpPost('m=yunying&c=skill&a=index_base_data', {}, {hideloading: true}).then(function (response) {
                    let res = response.data;
                    _this.searchList = Object.freeze(res.data.search_list);
                }).catch(function (error) {
                    console.log(error);
                });
            },
            // 批量操作
            handleSelectionChange(val) {
                if (val.length == 0) {
                    this.checkedAll = false;
                    this.checkedAllIndeterminate = false;
                } else {
                    if (val.length === this.list.length) {
                        this.checkedAll = true;
                        this.checkedAllIndeterminate = false;
                    } else {
                        this.checkedAll = false;
                        this.checkedAllIndeterminate = true;
                    }
                }
                this.multipleSelection = val;
            },
            batch(type) {
                if (this.multipleSelection.length == 0) {
                    message.error('请选择要操作的数据项');
                    return false;
                }

                let idArr = [];
                this.multipleSelection.forEach(function (item) {
                    idArr.push(item.id);
                })
                this.idArr = idArr;

                if (type == 'del') {
                    this.del();
                }
            },
            checkAll(val) {
                val ? this.checkedAllIndeterminate = false : '';
                this.$refs.multipleTable.toggleAllSelection();
            },

            del(idx) {
                let that = this,
                    params = {},
                    msg = '';

                if (typeof idx == 'undefined') { // 批量删除
                    params.del = this.idArr;
                    msg = '你确定要删除选中项吗？';
                } else {// 单个删除
                    params.del = that.list[idx].id;
                    msg = '你确定要删除当前项吗？';
                }

                delConfirm(this, params, function (params) {
                    httpPost('m=yunying&c=skill&a=del', params).then(function (res) {
                        if (res.data.error > 0) {
                            message.error(res.data.msg);
                        } else {
                            message.success(res.data.msg, function () {
                                that.$refs.multipleTable.clearSelection();
                                that.getList();
                            });
                        }
                    })
                }, msg)
            },

            openAdd(data) {
                this.id = data != '' ? data.id : 0;
                this.drawerAdd = true;
            },
            closeAdd() {
                this.drawerAdd = false;
                this.getList();
            },
        }
    });
</script>
</body>

</html>
