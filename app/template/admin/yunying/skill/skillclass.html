<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>
<style>
    .cell span{
        display: flex;
        align-items: center;
    }

    .el-tabs__header{
        display: none !important;
    }

    .el-tabs__content{
        padding: 0;
    }

    .dialog_item{
        margin-top: 25px;
        display: flex;
    }

    .item_span{
        width: 75px ;
        text-align: right;
        display: block;
    }

    .editIcon{
        padding-left: 5px;
        cursor: pointer;
    }
</style>

<body>
<div id="daohaapp" class="moduleElenAl">
    <div class="moduleSeachs">
        <div class="moduleSeachInpt">
            <span>技能分类</span>
        </div>
        <div class="moduleSeachButn">
                <el-button type="primary" icon="el-icon-document-add" size="mini"
                    @click="addVisible = true">添加分类</el-button>
        </div>
    </div>
    <div class="moduleElTable">
            <el-table :data="tableData" stripe border :key="randomKey" style="width: 100%"
                :header-cell-style="{ background: '#f5f7fa', color: '#606266' }" ref="multipleTable"
                @selection-change="handleSelectionChange" v-loading="loading">
            <template slot="empty">
                <p>{{dataText}}</p>
            </template>
            <el-table-column type="selection" width="55"></el-table-column>
            <el-table-column fixed="left" prop="id" label="分类编号" width="100"></el-table-column>
            <el-table-column label="分类名称(点击修改)" property="name">
                <template slot-scope="scope">
                    <el-input v-if="scope.row[scope.column.property + 'isShow']" :ref="scope.column.property"
                              v-model="scope.row.name" @blur="alterData(scope.row, scope.column)"></el-input>
                    <span v-else>
              一级分类：{{ scope.row.name }}<img @click="editData(scope.row, scope.column)" class="editIcon" src="../../../admin/images/bine.png" alt="" style="margin-left: 4px;" width="14" height="14">
            </span>
                </template>
            </el-table-column>
            <el-table-column prop="variable" label="分类变量名"></el-table-column>
            <el-table-column fixed="right" label="操作" width="140">
                <template slot-scope="scope">
                    <div class="cz_button">
                        <el-button size="mini" @click="openManage(scope)">管理</el-button>
                        <el-button type="danger" size="mini" @click="deleteRow(scope)">删除</el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>
    <div class="modulePaging">
        <div class="modulecz modulePagButn">
            <el-checkbox :indeterminate="isIndeterminate" v-model="checked" @change="selectAllBottom">全选
            </el-checkbox>
            <el-button @click="deleteRow(null, true)">批量删除</el-button>
        </div>
    </div>
    <el-dialog title="技能分类" width="40%" :visible.sync="addVisible" :modal-append-to-body="false">
        <class_add :position="tableData" @child-event-getlist="getList"></class_add>
    </el-dialog>
    <div class="modluDrawer">
        <el-drawer title="管理" :visible.sync="manageVisible" :append-to-body="true"
                   :modal-append-to-body="false" :show-close="true" :destroy-on-close="true" size="800px">
            <class_manage :id="info.id" @child-event-getlist="getList"></class_manage>
        </el-drawer>
    </div>
</div>
<!-- script -->
<script>
    const custoapp = new Vue({
        el: '#daohaapp',
        data: function () {
            return {
                loading: false,
                dataText: '数据加载中',
                tableData: [], //表格数据
                randomKey: Math.random(),
                checked: false,
                isIndeterminate: false,// checkbox 的不确定状态
                selectedItem: [],
                addVisible: false,
                oldData: null,
                info: {},
                manageVisible: false,
            }
        },
        components: {
            'class_add': httpVueLoader('./component/class_add.vue'),
            'class_manage': httpVueLoader('./component/class_manage.vue'),
        },
        created: function () {
            this.getList();
        },
        methods: {
            handleSelectionChange(val) {
                this.selectedItem = val;
                if (this.selectedItem.length == 0) {
                    this.isIndeterminate = false;
                    this.checked = false;
                } else {
                    if (this.selectedItem.length == this.tableData.length) {
                        this.isIndeterminate = false;
                        this.checked = true;
                    } else {
                        this.isIndeterminate = true;
                        this.checked = false;
                    }
                }
            },
            selectAllBottom(value) {
                value ? this.$refs.multipleTable.toggleAllSelection() : this.$refs.multipleTable.clearSelection();
            },
            getList() {
                this.addVisible = false;
                let _this = this;
                _this.loading = true;
                httpPost('m=yunying&c=skill_class&a=index',{}, {hideloading: true}).then(function (response) {
                    let res = response.data;
                    _this.tableData = res.data;
                    _this.loading = false;
                    if (_this.tableData.length === 0) {
                        _this.dataText = "暂无数据";
                    }
                }).catch(function (error) {
                    console.log(error);
                });
            },
            deleteRow(scope, isMore) {
                let params = {};
                if (isMore) {
                    if (!this.selectedItem.length) {
                        message.error('请选择要删除的数据');
                        return false;
                    }
                    let list = [];
                    for (let item of this.selectedItem) {
                        list.push(item.id);
                    }
                    params.delType = 'more';
                    params.del = list;
                } else {
                    // let index = scope.$index;
                    // this.tableData.splice(index, 1);
                    params.delType = 'single';
                    params.delid = scope.row.id;
                }

                delConfirm(this, params, this.delete);
            },
            delete(params) {
                let _this = this;
                httpPost('m=yunying&c=skill_class&a=del', params).then(function (response) {
                    let res = response.data;
                    if (res.error === 0) {
                        message.success('删除成功！');
                        _this.getList();
                    } else {
                        message.error('删除失败！');
                    }
                }).catch(function (error) {
                    console.log(error);
                });
            },
            editData(row, column) {
                this.oldData = JSON.parse(JSON.stringify(row));
                row[column.property + "isShow"] = true;
                //refreshTable是table数据改动时，刷新table的
                this.refreshTable();
                this.$nextTick(() => {
                    this.$refs[column.property] && this.$refs[column.property].focus();
                });
            },
            alterData(row, column) {
                row[column.property + "isShow"] = false;
                if (row[column.property] === this.oldData[column.property]) {
                    this.refreshTable();
                    return false;
                }
                let _this = this;
                let sendData = {id: row.id};
                sendData[column.property] = row[column.property];
                httpPost('m=yunying&c=skill_class&a=ajax', sendData).then(function (response) {
                    let res = response.data;
                    if (res.error === 0) {
                        message.success('修改成功');
                    } else {
                        message.error('修改失败');
                    }
                    row[column.property + "isShow"] = false;
                    _this.oldData = null;
                    _this.getList();
                }).catch(function (error) {
                    console.log(error);
                });
                this.refreshTable();
            },
            refreshTable() {
                this.randomKey = Math.random();
            },
            openManage(scope) {
                this.info = scope.row;
                this.manageVisible = true;
            }
        }
    });
</script>
</body>
<style>
	.el-table .el-table__cell {
    padding: 12px 0;
}
</style>
</html>
