<body class="body_ifm">
<div class="infoboxp">
    <div class="tty-tishi_top">
        <div class="tabs_info">
            <ul>
                <li><a href="index.php?m=admin_app_set">自定义配置</a></li>
                <li><a href="index.php?m=admin_app_set&c=seo">小程序SEO</a></li>
                <li class="curr"><a href="index.php?m=admin_app_set&c=career_counselor">求职助手</a></li>
            </ul>
        </div>

        <div class="tag_box">
            <iframe id="supportiframe" name="supportiframe" onload="returnmessage('supportiframe');"
                    style="display:none"></iframe>
            <form class="layui-form" action="index.php?m=admin_app_set&c=career_counselor" method="post"
                  enctype="multipart/form-data" target="supportiframe">
                <table width="100%" class="table_form">
                    <tr>
                        <th width="150" class="t_fl">求职助手头像：</th>
                        <td style="width: 100%">
                            <button type="button" class="yun_bth_pic lay-uploads upload-avatar" data-file="avatar"
                                    data-filetype="1" lay-data="{imgid: 'career_counselor_avatar'}">上传图片
                            </button>
                            <img id="career_counselor_avatar" src="{yun:}$career_counselor_avatar{/yun}"
                                 width="50" height="50" {yun:}if !$career_counselor_avatar{/yun}class="none"{yun:}/if{/yun}>
                        </td>
                    </tr>
					<tr>
                        <th width="150" class="t_fl">用户头像：</th>
                        <td>
                            <button type="button" class="yun_bth_pic lay-uploads upload-user_avatar" data-file="user_avatar"
                                    data-filetype="1" lay-data="{imgid: 'career_counselor_user_avatar'}">上传图片
                            </button>
                            <img id="career_counselor_user_avatar" src="{yun:}$career_counselor_user_avatar{/yun}"
                                 width="50" height="50" {yun:}if !$career_counselor_user_avatar{/yun}class="none"{yun:}/if{/yun}>
                        </td>
                    </tr>
                    <tr>
                        <th width="150" class="t_fl">求职助手名称：</th>
                        <td><input type="text" value="{yun:}$tplapp.career_counselor_name{/yun}" name="name" id="name"
                                   class="layui-input t_w480"></td>
                    </tr>
                    <tr>
                        <th width="150" class="t_fl">打招呼文案：</th>
                        <td><input type="text" value="{yun:}$tplapp.career_counselor_greet{/yun}" name="greet" id="greet"
                                   class="layui-input t_w480"></td>
                    </tr>

                    <tr>
                        <th width="150" class="t_fl">求职助手分享封面：</th>
                        <td>
                            <button type="button" class="yun_bth_pic lay-uploads upload-share_img" data-file="share_img"
                                    data-filetype="1" lay-data="{imgid: 'career_counselor_share_img'}">上传图片
                            </button>
                            <img id="career_counselor_share_img" src="{yun:}$career_counselor_share_img{/yun}"
                                 width="100" height="62" {yun:}if !$career_counselor_share_img{/yun}class="none"{yun:}/if{/yun}>
                        </td>
                    </tr>
                    <tr>
                        <th width="150" class="t_fl">求职助手分享标题：</th>
                        <td><input type="text" value="{yun:}$tplapp.career_counselor_share_title{/yun}"
                                   name="share_title" id="share_title" class="layui-input t_w480"></td>
                    </tr>
                    <tr>
                        <th width="150" class="t_fl">感兴趣的工作类型：</th>
                        <td>
                            <div class="admin_td_h" style="width:480px;position:relative">
                                <input id="job_class" type="hidden" value="{yun:}$tplapp.career_counselor_job_classid{/yun}"
                                       name="job_class">
                                <select id="jobclass_search" class="expect_text" name="jobclass_search"
                                        xm-select-type="jobclass" xm-select="jobclass_search" xm-select-search=""
                                        xm-select-max="5" xm-select-skin="default" xm-select-direction="down">
                                    <option value="">输入搜索，最多选5项</option>
                                </select>
                                {yun:}if $jionly!='1'{/yun}
                                <div onclick="index_job_new(5,'#workadds_job','#job_class','left:100px;top:100px; position:absolute;','1');"
                                     class="news_expect_text_new_nth" title="选择职位类别"></div>
                                {yun:}/if{/yun}
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <th width="150" class="t_fl">&nbsp;</th>
                        <td align="left" style="border-bottom:none; padding: 30px 0 0 0;">
                            <input class="tty_sub" type="submit" name="submit" value="提交"/>&nbsp;&nbsp;
                            <input class="tty_cz" type="reset" value="重置"/>
                        </td>
                    </tr>
                </table>
                <input type="hidden" name="pytoken" id='pytoken' value="{yun:}$pytoken{/yun}">
            </form>
        </div>

    </div>
</div>
<script>
    var weburl = '{yun:}$config.sy_weburl{/yun}';
    var formSelects = null;
    layui.use(['layer', 'laydate'], function () {
        formSelects = layui.formSelects;

        formSelects.btns('jobclass_search', []);
        //实时获取选中值
        formSelects.on('jobclass_search', function (id, vals, val, isAdd, isDisabled) {
            var jobvalue = [];
            vals.forEach(function (item, index) {
                jobvalue.push(item.value);
            })
            $('#job_class').val(jobvalue.join(','));
        }, true);
        //重设职位类别数据
        '{yun:}if $tplapp.career_counselor_job_classid{/yun}'
        jobSearchReset();
        '{yun:}/if{/yun}'
        formSelects.maxTips('jobclass_search', function (id, vals, val, max) {
            layer.msg('最多只能选择5个！', 2, 8);
        });
    });

    function jobSearchReset() {
        var formSelects = layui.formSelects,
            jobclassArr = $("#job_class").val() != '' ? $("#job_class").val().split(",") : [],
            jarr = [];

        for (var i = 0; i < jobclassArr.length; i++) {
            jarr.push({"name": jn[jobclassArr[i]], "value": jobclassArr[i], "selected": 'selected'});
        }
        formSelects.data('jobclass_search', 'local', {
            arr: jarr
        });
    }
</script>
<script src="{yun:}$config.sy_weburl{/yun}/js/layui.upload.js?v={yun:}$config.cachecode{/yun}"
        type='text/javascript'></script>
