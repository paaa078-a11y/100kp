<script>
    var form = null,
        formSelects = null,
        weburl = '{yun:}$config.sy_weburl{/yun}';

    var workToday = 2;

    layui.use(['layer', 'form', 'laydate'], function () {

        var layer = layui.layer,
            laydate = layui.laydate,
            $ = layui.$;

        form = layui.form;
        formSelects = layui.formSelects;

        laydate.render({
            elem: '#birthday',
            max: '2018-12',
            type: 'month',
            value: '{yun:}if $Info.birthday{/yun}{yun:}$Info.birthday{/yun}{yun:}else{/yun}1988-08{yun:}/if{/yun}'
        });

        formSelects.btns('resume_cityclass_search', []);
        formSelects.btns('resume_jobclass_search', []);
        //实时获取选中值
        formSelects.on('resume_jobclass_search', function (id, vals, val, isAdd, isDisabled) {
            var jobvalue = [];
            vals.forEach(function (item, index) {
                jobvalue.push(item.value);
            })
            $('#resume_job_class').val(jobvalue.join(','));
        }, true);
        formSelects.on('resume_cityclass_search', function (id, vals, val, isAdd, isDisabled) {
            var cityvalue = [];
            vals.forEach(function (item, index) {
                cityvalue.push(item.value);
            })
            $('#resume_city_class').val(cityvalue.join(','));
        }, true);
        formSelects.maxTips('resume_jobclass_search', function (id, vals, val, max) {
            layer.msg('最多只能选择5个！', 2, 8);
        });
        formSelects.maxTips('resume_cityclass_search', function (id, vals, val, max) {
            layer.msg('最多只能选择5个！', 2, 8);
        });

        form.on('checkbox(work_today)', function (data) {
            if (data.elem.checked){
                workToday = 1;
                $('#work_edate').val('');
                $('#work_edate').attr('disabled', true);
            }else{
                $('#work_edate').attr('disabled', false);
                workToday = 2;
            }
        });

        $("#leftbox").css({'height': $(window).height() - 50 + 'px', 'overflow': 'auto'});
    });


    function saveResume() {

        var uid = $.trim($("#uid").val());
        var pytoken = $.trim($("#pytoken").val());

        //  基本信息
        var resume_name = $.trim($("#resume_name").val());
        if (resume_name == '') {
            parent.layer.msg('求职者姓名不能为空！', 2, 8);
            return false;
        }
        var sex = $.trim($("input[name='sex']:checked").val());
        if (sex == '') {
            parent.layer.msg("性别不能为空！", 2, 8);
            return false;
        }
        var edu = $.trim($("#edu").val());
        if (edu == '') {
            parent.layer.msg("请选择最高学历！", 2, 8);
            return false;
        }
        var exp = $.trim($("#exp").val());
        if (exp == '') {
            parent.layer.msg("请选择工作经验！", 2, 8);
            return false;
        }
        var birthday = $.trim($("#birthday").val());
        if (birthday == '') {
            parent.layer.msg("出生年月不能为空！", 2, 8);
            return false;
        }
        var telphone = $.trim($("#telphone").val());
        if (telphone == '') {
            parent.layer.msg("手机号码不能为空！", 2, 8);
            return false;
        } else if (!isjsMobile(telphone)) {
            parent.layer.msg("手机号码格式错误！", 2, 8);
            return false;
        }
        var living = $.trim($("#living").val());
        if (living == '') {
            parent.layer.msg("现居住地不能为空！", 2, 8);
            return false;
        }

        //  求职意向
        var name = $.trim($("#expect_name").val());
        if (name == "") {
            parent.layer.msg('请填写期望职位！', 2, 8);
            return false;
        }
        var job_classid = $.trim($("#resume_job_class").val());
        if (job_classid == "") {
            parent.layer.msg('请选择工作职能！', 2, 8);
            return false;
        }
        var city_classid = $.trim($("#resume_city_class").val());
        if (city_classid == '') {
            parent.layer.msg('请选择工作地点！', 2, 8);
            return false;
        }
        var minsalary = $.trim($("#minsalary").val());
        var maxsalary = $.trim($("#maxsalary").val());
        if (minsalary == "" || parseInt(minsalary) == 0) {
            parent.layer.msg('请填写期望薪资！', 2, 8);
            return false;
        }
        if (maxsalary && parseInt(maxsalary) <= parseInt(minsalary)) {
            parent.layer.msg('最高薪资必须大于最低薪资！', 2, 8);
            return false;
        }

        var hy = $.trim($("#hy_val").val());

        var report = $.trim($("#user_report_val").val());
        if (report == "") {
            parent.layer.msg('请选择到岗时间！', 2, 8);
            return false;
        }
        var typeid = $.trim($("#user_type_val").val());
        if (typeid == "") {
            parent.layer.msg('请选择工作性质！', 2, 8);
            return false;
        }
        var jobstatus = $.trim($("#user_jobstatus_val").val());
        if (jobstatus == "") {
            parent.layer.msg('请选择求职状态！', 2, 8);
            return false;
        }
        //  工作经历
        var work_name = $.trim($("#work_name").val());
        var work_sdate = $.trim($("#work_sdate").val());
        var work_edate = $.trim($("#work_edate").val());
        var work_title = $.trim($("#work_title").val());
        var work_content = $.trim($("#work_content").val());
        if (work_edate != '') {
            sdate_w = work_sdate.replace(/-/g, "-");
            edate_w = work_edate.replace(/-/g, "-");
            var sd_w = new Date(Date.parse(sdate_w));
            var ed_w = new Date(Date.parse(edate_w));
            if (sd_w >= ed_w) {
                parent.layer.msg('结束日期必须大于开始日期！', 2, 8);
                return false;
            }
        }
        //  教育经历
        var edu_sdate = $.trim($("#edu_sdate").val());
        var edu_edate = $.trim($("#edu_edate").val());
        var edu_name = $.trim($("#edu_name").val());
        var education = $.trim($("#user_education_val").val());
        var specialty = $.trim($("#edu_specialty").val());
        if (edu_edate != '') {
            sdate_e = edu_sdate.replace(/-/g, "-");
            edate_e = edu_edate.replace(/-/g, "-");
            var sd_e = new Date(Date.parse(sdate_e));
            var ed_e = new Date(Date.parse(edate_e));
            if (sd_e >= ed_e) {
                parent.layer.msg('离校日期必须大于入学日期！', 2, 8);
            }
        }

        loadlayer();
        $.post("index.php?m=crm_chat&c=saveResume", {
            resume_name: resume_name, sex: sex, edu: edu, exp: exp, birthday: birthday, telphone: telphone, living: living,
            name: name, job_classid: job_classid, city_classid: city_classid, minsalary: minsalary, maxsalary: maxsalary, hy: hy, report: report, type: typeid, jobstatus: jobstatus,
            work_name: work_name, work_sdate: work_sdate, work_edate: work_edate, work_title: work_title, work_content: work_content, work_today: workToday,
            edu_name: edu_name, edu_sdate: edu_sdate, edu_edate: edu_edate, education: education, specialty: specialty, uid: uid, pytoken: pytoken
        }, function(data) {
            parent.layer.closeAll('loading');
            if(data){
                var res = JSON.parse(data);
                if(res.errcode==9){
                    parent.layer.msg(res.msg, 2, 9, function () {
                        parent.location.href = 'index.php?m=crm_chat&c=noresume&renor_prev=1';
                        parent.iframCloe();
                    });
                }else{
                    return parent.layer.msg(res.msg, 2, 8);
                }
            }
        });
    }
</script>
