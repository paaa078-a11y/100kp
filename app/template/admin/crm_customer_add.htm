    <link href="images/system.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css"/>

<body class="body_ifm">

<div class=" ">
    <div class="tty-tishi_top">
		<div class="admin_bold" style="padding:20px 0 0 40px;">录入客户</div> 
		<div class="clear"></div>
        <div class="">

            <div class="admin_add_box_c" style="border:none;padding-top: 0px;">

                <iframe id="supportiframe" name="supportiframe" onload="returnmessage('supportiframe');" style="display:none"></iframe>
                <form name="myform" {yun:}if $get_info.type==''{/yun}target="supportiframe"{yun:}/if{/yun} action="index.php?m=crm_my_customer&c=add" method="post" class="layui-form">

                    <div class="admin_add_list">
                        <div class="admin_add_list_name">客户类型</div>
                        <div class="admin_add_list_right">
                            <div class="layui-input-block">
                                <input type="radio" name="clue" lay-filter="clue" value="1" title="入库企业" checked/>
                                <input type="radio" name="clue" lay-filter="clue" value="2" title="线索企业"/>
                            </div>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 公司名称</div>
                        <div class="admin_add_list_right" style="position: relative; z-index: 100;">
                            <div style="display: flex;">
                                <input type="text" value="" name="name" id="companyName" class="layui-input" style='width:480px' autocomplete="off">
                                <span style="line-height: 38px; color:#ff2b00;">（下拉框为已存在客户）</span>
                            </div>
                            <div class="gsnamebox" style="display: none;" id="ajaxLoadData"></div>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 联系人</div>
                        <div class="admin_add_list_right">
                            <input type="text" value="" class="input-text" style="padding-left: 10px; width: 182px; margin-right: 0px;" placeholder="联系人" name="linkman" id="linkman"/>
                        </div>
                    </div>

                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 手机号码</div>
                        <div class="admin_add_list_right">
                            <input type="text" id="moblie" autocomplete="off" name="moblie" readonly="readonly" class="input-text" value="{yun:}$mobile{/yun}" onblur="checkUsername();" style="width: 187px;">
                            <font color="gray"></font>
                            <span class="admin_web_tip">手机号即为登录账号</span>
                        </div>
                    </div>

                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 账号密码</div>
                        <div class="admin_add_list_right">
                            <input type="password" value="" name="password" id="pwd" readonly="readonly" autocomplete="off" class="input-text" style="width: 187px;"/>
                            <span class="admin_web_tip">账号登录使用</span>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 所在地区</div>
                        <div class="admin_add_list_right">
                            <div class="layui-input-inline">
                                <select name="provinceid" id="provinceid" lay-filter="citys">
                                    <option value="">请选择</option>
                                    {yun:}foreach from=$cache.city_index key=j item=v{/yun}
                                    <option value="{yun:}$v{/yun}">{yun:}$cache.city_name[$v]{/yun}</option>
                                    {yun:}/foreach{/yun}
                                </select>
                            </div>
                            <div class="layui-input-inline">
                                <select name="cityid" id="cityid" lay-filter="citys">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-input-inline" style="display: none;" id="cityshowth">
                                <select name="three_cityid" id="three_cityid" lay-filter="citys">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 详细地址</div>
                        <div class="admin_add_list_right">
                            <input type="text" value="" name="address" id="address" class="layui-input" style="width:480px">
                            <font color="gray"></font>
                        </div>
                    </div>

                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 固定电话</div>
                        <div class="admin_add_list_right">
                            <input type="text" value="" class="input-text" style="padding-left: 10px; width: 182px; margin-right: 0px;" placeholder="固定电话" name='linkphone' id="linkphone"/>
                            <font color="gray"></font>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 企业简介</div>
                        <div class="admin_add_list_right">
                            <script id="myEditor" name="content" type="text/plain" style="width:480px;height:200px;"></script>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> 其他信息</div>
                        <div class="admin_add_list_right">
                            <div class="layui-input-inline">
                                <select name="hy" id="hy" lay-filter="hy">
                                    <option value="">所属行业</option>
                                    {yun:}foreach from=$cache.industry_index item=v{/yun}
                                    <option value="{yun:}$v{/yun}">{yun:}$cache.industry_name[$v]{/yun}</option>
                                    {yun:}/foreach{/yun}
                                </select>
                            </div>
                            <div class="layui-input-inline">
                                <select name="pr" id="pr" lay-filter="pr">
                                    <option value="">企业性质</option>
                                    {yun:}foreach from=$cache.comdata.job_pr item=v{/yun}
                                    <option value="{yun:}$v{/yun}">{yun:}$cache.comclass_name[$v]{/yun}</option>
                                    {yun:}/foreach{/yun}
                                </select>
                            </div>
                            <div class="layui-input-inline">
                                <select name="mun" id="mun" lay-filter="mun">
                                    <option value="">企业规模</option>
                                    {yun:}foreach from=$cache.comdata.job_mun item=v{/yun}
                                    <option value="{yun:}$v{/yun}">{yun:}$cache.comclass_name[$v]{/yun}</option>
                                    {yun:}/foreach{/yun}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> </div>
                        <div class="admin_add_list_right">
                            <div class="layui-input-inline">
                                <select name="crm_type" id="crm_type" lay-filter="crm_type">
                                    <option value="">客户等级</option>
                                    {yun:}foreach from=$cache.crmdata.client_type item=v{/yun}
                                    <option value="{yun:}$v{/yun}" title='{yun:}$cache.crmclass_name[$v]{/yun}'>{yun:}$cache.crmclass_name[$v]{/yun}</option>
                                    {yun:}/foreach{/yun}
                                </select>
                            </div>
                            <div class="layui-input-inline">
                                <select name="crm_status" id="crm_status" lay-filter="crm_status">
                                    <option value="">客户状态</option>
                                    {yun:}foreach from=$cache.crmdata.client_status item=v{/yun}
                                    <option value="{yun:}$v{/yun}" title='{yun:}$cache.crmclass_name[$v]{/yun}'>{yun:}$cache.crmclass_name[$v]{/yun}</option>
                                    {yun:}/foreach{/yun}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <div class="admin_add_list_name"><span class="admin_required_icon"></span> </div>
                        <div class="admin_add_list_right">
                            <div class="layui-input-inline rating">
                                <select name="rating_name" id="rating_name" lay-filter="rating_name">
                                    <option value="">会员等级</option>
                                    {yun:}foreach from=$rating_list item=v{/yun}
                                    <option value="{yun:}$v.id{/yun}" title='{yun:}$v.name{/yun}'>{yun:}$v.name{/yun}</option>
                                    {yun:}/foreach{/yun}
                                </select>
                            </div>
                            <div class="layui-input-inline">
                                <select name="crm_uid" id="crm_uid" lay-filter="crm_uid">
                                    <option value="">业务经理</option>
                                    {yun:}foreach from=$crmUser item=v{/yun}
                                    <option value="{yun:}$v.uid{/yun}" title='{yun:}$v.name{/yun}'>{yun:}$v.name{/yun}</option>
                                    {yun:}/foreach{/yun}
                                </select>
                            </div>
                            <span class="admin_web_tip" style="margin-left: 10px;">未选择业务经理，客户将绑定在自己名下</span>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <div class="admin_add_list_name">审核状态</div>
                        <div class="admin_add_list_right">
                            <div class="layui-input-block">
                                <input type="radio" name="r_status" value="1" title="已审核" checked/>
                                <input type="radio" name="r_status" value="0" title="待审核"/>
                            </div>
                        </div>
                    </div>
                    <div class="admin_add_list">
                        <input class="layui-btn layui-btn-normal addbtn" type="button" name="submit" value="&nbsp;添 加&nbsp;" onclick="CheckMember();"/>
                    </div>
                    <input type="hidden" name="pytoken" id="pytoken" value="{yun:}$pytoken{/yun}">
                </form>
            </div>
        </div>
    </div>
</div>

<script language=javascript src='{yun:}$config.sy_weburl{/yun}/data/plus/city.cache.js?v={yun:}$config.cachecode{/yun}'></script>
<script language=javascript src='{yun:}$config.sy_weburl{/yun}/js/city.js?v={yun:}$config.cachecode{/yun}'></script>
<script type="text/javascript">
    // 延时去除节点只读属性
    function removeReadonly(id){
        setTimeout(function(){
            $('#'+id).removeAttr('readonly');
        }, 200)
    }
    // 防止密码输入框出现已保存用户信息提示
    $('#pwd').focus(function(){
        removeReadonly('pwd')
    }).blur(function(){
        $('#pwd').attr('readonly', true);
    }).mousedown(function(){
        if ($('#pwd').val() == '' && $('#pwd').attr('readonly') == undefined) {
            $('#pwd').attr('readonly', true);
            removeReadonly('pwd')
        }
    }).keydown(function(e){
        if (e.key == 'Backspace' && $('#pwd').val().length == 1 && $('#pwd').attr('readonly') == undefined) {
            $('#pwd').val('');
            $('#pwd').attr('readonly', true);
            removeReadonly('pwd')
        }
    })
    // 防止用户名输入框出现已保存用户信息提示
    $('#moblie').focus(function(){
        removeReadonly('moblie')
    }).blur(function(){
        $('#moblie').attr('readonly', true);
    }).mousedown(function(){
        if ($('#moblie').val() == '' && $('#moblie').attr('readonly') == undefined) {
            $('#moblie').attr('readonly', true);
            removeReadonly('moblie')
        }
    }).keydown(function(e){
        if (e.key == 'Backspace' && $('#moblie').val().length == 1 && $('#moblie').attr('readonly') == undefined) {
            $('#moblie').val('');
            $('#moblie').attr('readonly', true);
            removeReadonly('moblie')
        }
    })
    layui.use(['layer', 'form', 'laydate'], function () {
        var form = layui.form,
            laydate = layui.laydate,
            $ = layui.$;

        laydate.render({
            elem: '#stime'
            , type: 'datetime'
        });
    });

    var ue = UE.getEditor('myEditor', {
        toolbars: [
            ['Bold', 'italic', 'underline', 'removeformat',
                '|', 'justifyleft', 'justifycenter', 'justifyright',
                'insertorderedlist', 'insertunorderedlist'
            ]
        ],
        wordCount: false,
        elementPathEnabled: false,
        initialFrameHeight: 200
    });

    $(function () {
        $("#companyName").bind('input propertychange', function () {
            var name = $("#companyName").val();
            var pytoken = $("#pytoken").val();

            $('#ajaxLoadData').html('<div class="gsnamebox_h" style="text-align: center;">加载中</div>');
            $('#ajaxLoadData').show();

            $.post("index.php?m=crm_my_customer&c=checkComName", {companyName: name, pytoken: pytoken}, function (data) {

                var data = eval('(' + data + ')');
                var html = '<div class="gsnametit"><span class="gsname">名称</span><span class="gsname_xs"> 所属业务员</span></div>\n' +
                    '<div class="gsnamebox_h">';
                if (data && data.length > 0) {
                    html += '';
                    for (var i = 0; i < data.length; i++) {
						if(data[i].crm_name){
							html += '<div class="zccomlist"><span  class="gscname">' + data[i].name + '</span><span class="gsname_xs">' + data[i].crm_name + '</span></div>';
						}else{
							html += '<div class="zccomlist"><span  class="gscname">' + data[i].name + '</span><span class="gsname_xs">' + '-' + '</span></div>';	
						}
                    }
                    html += '</div>';
                    $('#ajaxLoadData').html(html);
                } else {
                    $('#ajaxLoadData').html('');
                    $('#ajaxLoadData').hide();
                }
            });
        })
    })

    $(document).click(function () {
        $('#ajaxLoadData').html('');
        $('#ajaxLoadData').hide();
    });

</script>

<script language="javascript">

    function checkUsername() {
        var moblie = $.trim($("#moblie").val());
        var pytoken = $.trim($("#pytoken").val());
        if (moblie) {
            $.post("index.php?m=crm_my_customer&c=check", {moblie: moblie, pytoken: pytoken}, function (msg) {
                if (msg) {
                    layer.tips(msg, "#moblie", {
                        guide: 1,
                        style: ['background-color:#F26C4F; color:#fff;top:-7px', '#F26C4F']
                    });
                    $("#moblie").attr("vtype", '1');
                } else if ($("#moblie").attr('vtype') == '1') {
                    layer.closeTips();
                    $("#moblie").attr("vtype", '0');
                }
            });
        }
    }

    function CheckMember() {

        var clue = $("input[name=clue]:checked").val();

        var moblie = $("#moblie").val();
        var password = $("input[name='password']").val();
        var name = $("input[name='name']").val();

        if (moblie == '' && clue == 1) {
            layer.msg('手机号码不能为空！', 2, 8);
            return false;
        }
        // if (password == '' && clue == 1) {
        //     layer.msg('账号密码不能为空！', 2, 8);
        //     return false;
        // }
        if (name == '' && clue == 1) {
            layer.msg('公司名称不能为空！', 2, 8);
            return false;
        }

        if (moblie!= '' && isjsMobile(moblie) == false) {
            layer.msg('手机号码格式错误！', 2, 8);
            return false;
        }

        var hy = $('#hy').val();
        var pr = $('#pr').val();
        var mun = $('#mun').val();
        var provinceid = $('#provinceid').val();
        var cityid = $('#cityid').val();
        var three_cityid = $('#three_cityid').val();
        var address = $('#address').val();
        var content = ue.getContent();
        var linkman = $("#linkman").val();
        if (linkman == '' && clue == 1) {
            layer.msg('联系人不能为空！', 2, 8);
            return false;
        }
        // var email = $("input[name='email']").val();
        // var myreg = /^([a-zA-Z0-9\-]+[_|\_|\.]?)*[a-zA-Z0-9\-]+@([a-zA-Z0-9\-]+[_|\_|\.]?)*[a-zA-Z0-9]+\.[a-zA-Z]{2,3}$/;
        // if (email != "" && !myreg.test(email)) {
        //     layer.msg('联系邮箱格式错误！', 2, 8);
        //     return false;
        // }
        var linkphone = $("input[name='linkphone']").val();

        if (clue == 2 && moblie == '' && name == '' && provinceid == '' && cityid == '' && address == '' && linkman == '' && linkphone == '' && email == '' && content == ''){

            layer.msg('至少填写一条有效线索！', 2, 8);
            return false;
        }

        var crm_type = $("#crm_type").val();
        var crm_status = $("#crm_status").val();
        var rating = $("#rating_name").val();
        var crm_uid = $("#crm_uid").val();
        var r_status = $("input[name=r_status]:checked").val();


        var params = {
            clue: clue,
            moblie: moblie,
            password: password,
            name: name,
            hy: hy,
            pr: pr,
            mun: mun,
            provinceid: provinceid,
            cityid: cityid,
            three_cityid: three_cityid,
            address: address,
            content: content,
            linkman: linkman,
            linkphone: linkphone,
            // email: email,
            crm_type: crm_type,
            crm_status: crm_status,
            rating: rating,
            crm_uid: crm_uid,
            r_status: r_status,
            pytoken: $("#pytoken").val()
        };
        var url = 'index.php?m=crm_my_customer&c=add';
        loadlayer();
        $.ajax({
            data: params,
            type: 'post',
            dataType: 'json',
            url: url,
            success: function (data) {
                parent.layer.closeAll('loading');
                if (data.errcode == 9) {
                    parent.layer.msg(data.msg, 2, 9, function () {

                        parent.location.href = 'index.php?m=crm_my_customer';
                        parent.iframCloe();
                    });
                }else{

                    parent.layer.msg(data.msg, 2, 8);
                    return false;
                }
            }
        })
    }

</script>

</body>
</html>
