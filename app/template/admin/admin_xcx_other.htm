<body class="body_ifm">

				<iframe id="supportiframe"  name="supportiframe" onload="returnmessage('supportiframe');" style="display:none"></iframe>
				<form method="post" target="supportiframe" action="" name="config" class="layui-form">

							<tr>
							  <th class="t_fr">appid:</th>
							  <td>
									<div class="layui-input-block t_w480">
										<input name="appid[]" value="{yun:}$base[0]{/yun}" autocomplete="off" class="layui-input" type="text" size="60" maxlength="255" />
									</div>
							  </td>
							</tr>
							<tr>
							  <th class="t_fr">appSecret:</th>
							  <td>
									<div class="layui-input-block t_w480">
										<input name="appSecret[]" value="{yun:}$base[1]{/yun}" autocomplete="off" class="layui-input" type="text" size="60" maxlength="255" />
									</div>
							  </td>
							</tr>
						</table>
						{yun:}foreach from=$rows key=key item=v{/yun}
						{yun:}if $key>0{/yun}

							<tr>
							  <th class="t_fr">appid:</th>
							  <td>
									<div class="layui-input-block t_w480">
										<input name="appid[]" value="{yun:}$v[0]{/yun}" autocomplete="off" class="layui-input" type="text" size="60" maxlength="255" />
									</div>
							  </td>
							</tr>
							<tr>
							  <th class="t_fr">appSecret:</th>
							  <td>
									<div class="layui-input-block t_w480">
										<input name="appSecret[]" value="{yun:}$v[1]{/yun}" autocomplete="off" class="layui-input" type="text" size="60" maxlength="255" />
									</div>
							  </td>
							</tr>
						</table>
						{yun:}/if{/yun}
						{yun:}/foreach{/yun}
						<table width="100%" class="table_form" id="end_table">
							<tr>
								<th>&nbsp;</th>
								<td align="left">
									<input class="tty_sub" id="pay_config" type="submit" name="pay_config" value="&nbsp; 保 存 &nbsp;"  />&nbsp;&nbsp;
									<input class="tty_cz" type="reset" name="reset" value="&nbsp; 重 置 &nbsp;" />
								</td>
							</tr>
						</table>
					</div>
					<input type="hidden" name="pytoken"  id='pytoken' value="{yun:}$pytoken{/yun}">
