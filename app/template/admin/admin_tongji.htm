<script type="text/javascript">
	layui.use(['laydate'], function(){
		var laydate = layui.laydate
			,$ = layui.$;

		laydate.render({
			elem: '#date',range:'~'
		});
		$('.tabs_info li').on('click', function(){
			var fl = $(this).attr('data-id');
			if(!$(this).hasClass('curr')){
				$('.tjdiv').hide();
				$('#' + fl).show();
				$('.tabs_info li').removeClass('curr');
				$(this).addClass('curr');
			}
		})
	});
	function tongjiChange(_this, url){
		$(".admin_tj_a").removeClass('admin_tj_cur');
		$(_this).addClass('admin_tj_cur');
		$("#tbrightMain").attr("src", url);
	}

	function cktimesave() {
		var date = $("#date").val();
		if(!date || date == '') {
			layer.msg("请选择时间段！", 2, 8);
			return false;
		}

		$(".admin_tj_a").removeClass('admin_tj_cur');
		$("#tbrightMain").attr("src", "index.php?m=admin_tongji&c=chart&date=" + date);
		return false;
	}
</script>
