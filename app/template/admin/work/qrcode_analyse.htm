<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <link href="images/reset.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css"/>
    <link href="./images/system.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css"/>
    <link href="{yun:}$config.sy_weburl{/yun}/js/layui/css/layui.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css"/>
    <link href="images/statis.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css"/>
    <title>后台管理-群活码分析</title>
    <style>
        .admin_new_search_time {width: 120px !important;}
        input {font-size: 12px;}
    </style>
</head>
<body class="body_ifm">
<div class="infoboxp">
    <div class="tty-tishi_top">
        <div class="admin_new_search_box adminPlayearchBox">
            <form class="layui-form">
                <input type="hidden" name="pytoken" id="pytoken" value="{yun:}$pytoken{/yun}">
                <div class="timeModeAlls" id="time_range">
                    <div class="timeModeOne">
                        <input type="text" class="admin_new_search_time" id="time_begin">
                    </div>
                    <div class="timeModeOne">
                        <input type="text" class="admin_new_search_time" id="time_end">
                    </div>
                    <button class="admin_new_bth" lay-filter="query" onclick="return query();">查询</button>
                    <div class="layui-input-inline" style="padding:0 10px; overflow: hidden;display: flex;align-items: center;">
                        <input name="time" value="0" title="今天" type="radio" lay-filter="time" {yun:}if $time== '0'{/yun} checked {yun:}/if{/yun} />
                        <input name="time" value="1" title="昨日" type="radio" lay-filter="time" {yun:}if $time== '1'{/yun} checked {yun:}/if{/yun} />
                        <input name="time" value="7" title="7天内" type="radio" lay-filter="time" {yun:}if $time== '7'{/yun} checked {yun:}/if{/yun} />
                        <input name="time" value="30" title="30天内" type="radio" lay-filter="time" {yun:}if (!$smarty.get.time_begin && $time=="") || $time== '30' {/yun} checked {yun:}/if{/yun} />
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="clear"></div>
    <div class="adminstatis_box nstatisBoxProfit">
        <div class="com_pay_balance">
            <div class="com_pay_balance_data_q">
                <div class="balanceFlex">
                    <div class="com_pay_balance_data_name">今日入群</div>
                    <div class="com_pay_balance_data_n">
                        <strong>{yun:}$inToday{/yun}</strong>
                    </div>
                </div>
            </div>
        </div>
        <div class="com_pay_balance">
            <div class="com_pay_balance_data_q border_blue">
                <div class="balanceFlex">
                    <div class="com_pay_balance_data_name">今日退群</div>
                    <div class="com_pay_balance_data_n color_blue">
                        <strong>{yun:}$outToday{/yun}</strong>
                    </div>
                </div>
            </div>
        </div>
        <div class="com_pay_balance">
            <div class="com_pay_balance_data_q">
                <div class="balanceFlex">
                    <div class="com_pay_balance_data_name">总入群数</div>
                    <div class="com_pay_balance_data_n">
                        <strong>{yun:}$inAll{/yun}</strong>
                    </div>
                </div>
            </div>
        </div>
        <div class="com_pay_balance">
            <div class="com_pay_balance_data_q border_blue">
                <div class="balanceFlex">
                    <div class="com_pay_balance_data_name">总退群数</div>
                    <div class="com_pay_balance_data_n color_blue">
                        <strong>{yun:}$outAll{/yun}</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="clear"></div>

    <div class="payments_com_pay_cont">
        <div class="admin_atatic_chart bg_gray" id="chart" style="height:350px;"></div>
    </div>
</div>
<script src="{yun:}$config.sy_weburl{/yun}/js/layui/layui.js?v={yun:}$config.cachecode{/yun}"></script>
<script src="{yun:}$config.sy_weburl{/yun}/js/layui/phpyun_layer.js?v={yun:}$config.cachecode{/yun}"></script>
<script src="{yun:}$config.sy_weburl{/yun}/js/echarts.min.js?v={yun:}$config.cachecode{/yun}"></script>
<script src="{yun:}$config.sy_weburl{/yun}/js/jquery-1.8.0.min.js?v={yun:}$config.cachecode{/yun}"></script>
<script>
    function getDateTimeStr(timestamp) {
        var d = new Date(timestamp);    //根据时间戳生成的时间对象
        var h = d.getHours(),
            m = d.getMinutes(),
            s = d.getSeconds(),
            month = d.getMonth() + 1,
            day = d.getDate();

        h = h < 10 ? '0' + h : h;
        m = m < 10 ? '0' + m : m;
        s = s < 10 ? '0' + s : s;

        month = month < 10 ? '0' + month : month;
        day = day < 10 ? '0' + day : day;

        return (d.getFullYear()) + "-" + month + "-" + day + " " +
            h + ":" + m + ":" + s;
    }

    function getToday() {
        var today = new Date();
        today.setHours(0);
        today.setMinutes(0);
        today.setSeconds(0);
        today.setMilliseconds(0);
        return today;
    }

    layui.use(['form', 'laydate'], function () {
        var laydate = layui.laydate
            , form = layui.form
            , $ = layui.$;

        laydate.render({
            elem: '#time_begin' //指定元素
            , type: 'datetime'
            , value: '{yun:}$defaultTimeBegin{/yun}'
        });

        laydate.render({
            elem: '#time_end' //指定元素
            , type: 'datetime'
            , value: '{yun:}$defaultTimeEnd{/yun}'
        });

        form.on('radio(time)', function (data) {

            var today = getToday();
            var diff = 1000 * 60 * 60 * 24 * data.value;
            var day = new Date(today - diff);
            window.location = 'index.php?m=admin_workwx_qrcode&c=analyse&state={yun:}$state{/yun}&time_begin=' + getDateTimeStr(Date.parse(day)) + '&time_end=' + getDateTimeStr(Date.parse(new Date())) + '&time=' + data.value;
        });

        var title = '{yun:}$title{/yun}';
        var names = [
            {yun:}foreach from=$names item=v key=kkk{/yun}
            {yun:}if $kkk > 0{/yun},{yun:}/if{/yun}
            '{yun:}$v{/yun}'
            {yun:}/foreach{/yun}
        ];
        var dataGroupNames = [
            '入群客户',
            '退群客户'
        ];

        var values = [
            {yun:}foreach from=$values item=v key=k{/yun}

            {yun:}if $k > 0{/yun},{yun:}/if{/yun}
            {
                name : '{yun:}$v["name"]{/yun}',
                type : '{yun:}$v["type"]{/yun}',
                label :
                {
                    normal: {
                        show:true,
                        position:'top',
                        textStyle:{color: '#27727B'}
                    }
                },
                data : [
                    {yun:}foreach from = $v["data"] item = r key = kk{/yun}
                    {yun:}if $kk > 0{/yun},{yun:}/if{/yun}
                    parseFloat('{yun:}$r{/yun}')
                    {yun:}/foreach{/yun}
                ],
                smooth: true
            }
            {yun:}/foreach{/yun}
            ];

        refreshBarChart(title, names, values, dataGroupNames);
    });

    function query() {
        window.location = 'index.php?m=admin_workwx_qrcode&c=analyse&state={yun:}$state{/yun}&time_begin=' + $("#time_begin").val() + '&time_end=' + $('#time_end').val();
        return false;
    }

    function refreshBarChart(title, names, values, dataGroupNames) {
        var option = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {            // 坐标轴指示器，坐标轴触发有效
                    type: 'shadow'        // 默认为直线，可选为：'line' | 'shadow'
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },

            title: {
                text: '客户群活码数据统计',
                subtext: '{yun:}$config.sy_webname{/yun}'
            },
            legend: {
                data: dataGroupNames
            },
            xAxis: [
                {
                    type: 'category',
                    data: names
                }
            ],
            yAxis: [
                {
                    type: 'value'
                }
            ],
            series: values
        };

        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById('chart'));

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    }
</script>
</body>
</html>
