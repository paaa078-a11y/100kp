<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>

	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=utf-8">
		<link href="images/reset.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
		<link href="images/system.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
		<link href="images/table_form.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet" type="text/css" />
		<script src="{yun:}$config.sy_weburl{/yun}/js/jquery-1.8.0.min.js?v={yun:}$config.cachecode{/yun}"></script>
		<script src="js/admin_public.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
		<link href="{yun:}$config.sy_weburl{/yun}/js/layui/css/layui.css?v={yun:}$config.cachecode{/yun}" rel="stylesheet">
		<script src="{yun:}$config.sy_weburl{/yun}/js/layui/layui.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
		<script src="{yun:}$config.sy_weburl{/yun}/js/layui/phpyun_layer.js?v={yun:}$config.cachecode{/yun}"></script>

		<title>后台管理</title>
	</head>
	<body class="body_ifm">
		<div class="infoboxp">
			
			<div class="tty-tishi_top">
						<div class="main_tag" style="background: none;">
						
					<div class="tabs_info">
								<ul>
									<li class="on">QQ登录配置</li>
									<li class="">新浪微博配置</li> 
									 
								</ul>
							</div>
			</div> 
					
				<div class="clear"></div>
			
			
			
			  <div class="wxbd_box" ><div class="hiddendiv">
			
			 

				<form class="layui-form list_border" style="margin-top: 0;">
					
				 
					
					<div class="layui-form-item">
						<label class="layui-form-label">QQ登录是否开启：</label>
						<div class="layui-input-inline">
							<input type="checkbox" name="sy_qqlogin" lay-skin="switch" lay-text="开启|关闭" {yun:}if $config.sy_qqlogin=="1" {/yun}checked{yun:}/if{/yun}>
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">appid：</label>
						<div class="layui-input-inline t_w480">
							<input class="layui-input" type="text" name="sy_qqappid" id="sy_qqappid" value="{yun:}$config.sy_qqappid{/yun}" size="30" maxlength="255" />
						</div>
						<span class="admin_web_tip">如：1002478xx</span>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">appkey：</label>
						<div class="layui-input-inline t_w480">
							<input class="layui-input" type="text" name="sy_qqappkey" id="sy_qqappkey" value="{yun:}$config.sy_qqappkey{/yun}" size="30" maxlength="255" />
						</div>
						<span class="admin_web_tip">如：4dd1c30d472676914f2fbfbnjt33</span>
					</div>
				
					<div class="layui-form-item">
						<label class="layui-form-label">应用打通是否申请通过：</label>
						<div class="layui-input-inline" style="width: auto;">
							<input type="checkbox" name="sy_qqdt" lay-skin="switch" lay-text="是|否" {yun:}if $config.sy_qqdt=="1" {/yun}checked{yun:}/if{/yun}>
						</div>
						<span class="admin_web_tip">QQ互联平台移动应用和网站应用是否已打通，未打通的请不要打开</span>
					</div>
					<div class="layui-form-item pdleft180">
						<input class="layui-btn tty_sub" id="qqconfig" type="button" name="qqconfig" value="提交" />&nbsp;&nbsp;
						<input class="layui-btn tty_cz" type="reset" value="重置" />
					</div>
				</form>
 </div>
	<div class="hiddendiv"style="display: none;">

				<form class="layui-form list_border">
			 
					<div class="layui-form-item">
						<label class="layui-form-label">微博登录是否开启：</label>
						<div class="layui-input-inline">
							<input type="checkbox" name="sy_sinalogin" lay-skin="switch" lay-text="开启|关闭" {yun:}if $config.sy_sinalogin=="1" {/yun}checked{yun:}/if{/yun}>
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">App Key：</label>
						<div class="layui-input-inline">
							<input class="tty_input t_w480" type="text" name="sy_sinaappid" id="sy_sinaappid" value="{yun:}$config.sy_sinaappid{/yun}" size="30" maxlength="255" />
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">App Secret：</label>
						<div class="layui-input-inline">
							<input class="tty_input t_w480" type="text" name="sy_sinaappkey" id="sy_sinaappkey" value="{yun:}$config.sy_sinaappkey{/yun}" size="40" maxlength="255" />
						</div>
					</div>
					<div class="layui-form-item pdleft180">
						<input class="layui-btn tty_sub" id="sinaconfig" type="button" name="msgconfig" value="提交" />&nbsp;&nbsp;
						<input class="layui-btn tty_cz" type="reset" value="重置" />
					</div>
					
				</form>
				<input type="hidden" name="pytoken" id='pytoken' value="{yun:}$pytoken{/yun}">
			</div>
		</div>
 </div>
		<script>
			layui.use(['layer', 'form'], function() {
				var layer = layui.layer,
					form = layui.form,
					$ = layui.$;
			});

			$(function() {
				$("#qqconfig").click(function() {
					loadlayer();
					$.post("index.php?m=qqconfig&c=save", {
						config: $("#qqconfig").val(),
						sy_qqdt: $("input[name=sy_qqdt]").is(':checked') ? 1 : 0,
						sy_qqlogin: $("input[name=sy_qqlogin]").is(':checked') ? 1 : 0,
						sy_qqappkey: $("#sy_qqappkey").val(),
						sy_qqappid: $("#sy_qqappid").val(),
						pytoken: $("#pytoken").val()
					}, function(data, textStatus) {
						parent.layer.closeAll('loading');
						config_msg(data);
					});
				});
				$("#sinaconfig").click(function() {
					loadlayer();
					$.post("index.php?m=qqconfig&c=save", {
						config: $("#sinaconfig").val(),
						sy_sinalogin: $("input[name=sy_sinalogin]").is(':checked') ? 1 : 0,
						sy_sinaappkey: $("#sy_sinaappkey").val(),
						sy_sinaappid: $("#sy_sinaappid").val(),
						pytoken: $("#pytoken").val()
					}, function(data, textStatus) {
						parent.layer.closeAll('loading');
						config_msg(data);
					});
				});

			})
		</script>
		<script>
			layui.use(['layer', 'form'], function() {
			  var $switchtag = $("div.main_tag ul li");
					$switchtag.click(function() {
						$(this).addClass("on").siblings().removeClass("on");
						var index = $switchtag.index(this);
						$("div.wxbd_box > div").eq(index).show().siblings().hide();
					});
					
			});
		</script>
	</body>

</html>
