<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../../../admin/header.js"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>
<body>
<div id="daohaapp" class="moduleElenAl">
    <div class="moduleSeachmore">
        <div class="tableSeackellsd" style="margin-bottom: 12px; padding: 2px 0;">
            <el-input v-model="keyword" placeholder="请输入关键字" size="small" prefix-icon="el-icon-search" clearable>
                <el-select v-model="search_type" size="small" slot="prepend" placeholder="请选择">
                    <el-option label="发送用户" value="1"></el-option>
                    <el-option label="接收用户" value="2"></el-option>
                </el-select>
            </el-input>
        </div>
        <div class="tableSeachInpt tableSeachInptsmall">
            <el-select v-model="ctime" size="small" slot="prepend" placeholder="反馈时间" clearable @change="search">
                <el-option label="今天" value="1"></el-option>
                <el-option label="最近三天" value="3"></el-option>
                <el-option label="最近七天" value="7"></el-option>
                <el-option label="最近半月" value="15"></el-option>
                <el-option label="最近一月" value="30"></el-option>
            </el-select>
        </div>
        <div class="tableSeachInpt tableSeachInptsmall">
            <el-select v-model="result" size="small" slot="prepend" placeholder="状态" clearable @change="search">
                <el-option label="推送有效" value="1"></el-option>
                <el-option label="推送无效" value="2"></el-option>
            </el-select>
        </div>
        <div class="tableSeachInpt">
            <el-button type="primary" size="mini" icon="el-icon-search" @click="search">查询</el-button>
        </div>
    </div>
    <div class="moduleElTable">
        <el-table :data="tableData" border style="width: 100%"
                  :header-cell-style="{background:'#f5f7fa',color:'#606266'}" height="100%" @selection-change="handleSelectionChange"
                  ref="multipleTable" :default-sort = "{prop: 'id', order: 'descending'}" @sort-change="sortChange" v-loading="loading" :empty-text="emptytext">
            <el-table-column type="selection" width="55">
            </el-table-column>
            <el-table-column sortable="custom"  prop="id" label="编号" width="80">
            </el-table-column>
            <el-table-column prop="fname" label="发送用户" width="180">
            </el-table-column>
            <el-table-column prop="sname" label="接收用户" width="220">
            </el-table-column>
            <el-table-column prop="type_n" label="推送类型" width="220">
            </el-table-column>
            <el-table-column prop="ctime" label="推送时间" width="180">
            </el-table-column>
            <el-table-column prop="result_n" label="个推结果" width="220">
                <template slot-scope="scope">
					<!--
                    <el-tag effect="plain" size="small" :type="scope.row.result == 'ok' ? '' : 'danger'">
                        {{scope.row.result_n}}
                    </el-tag>-->
					<span :class="scope.row.result == 'ok' ? '' : 'sbdanger'">{{scope.row.result_n}}</span>
					
                </template>
            </el-table-column>
            <el-table-column prop="status_n" label="用户状态">
            </el-table-column>
            <el-table-column fixed="right" label="操作" width="120">
                <template slot-scope="scope">
                    <div class="moduleElTaCaoz">
                        <el-button type="danger" @click="delrow(scope.row)">删除</el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>
    <div class="modulePaging">
        <div>
            <el-checkbox v-model="checkedAll" @change="selectAllBottom">全选</el-checkbox>
            <el-button size="mini" @click="delAllBottom">批量删除</el-button>
        </div>
        <div class="modulePagNum">
            <el-pagination background @size-change="handleSizeChange" @current-change="handleCurrentChange"
                           :current-page="currentPage" :page-sizes="pageSizes" :page-size="perPage"
                           layout="total, sizes, prev, pager, next, jumper" :total="total">
            </el-pagination>
        </div>
    </div>
</div>
<!-- script -->
<script>
    const custoapp = new Vue({
        el: '#daohaapp',
        data: function () {
            return {
                loading: false,
                emptytext: '暂无数据',

                search_type: '1',
                keyword: '',
                ctime: null,
                result: null,
                sort_type: '',
                sort_col: '',
                currentPage: 1,
				prevPage:0,
                perPage: 0,
                pageSizes: [],
                total: 0,
                checkedAll: false,
                selectedItem:[],
                tableData: [],
                items: [
                    {type: '', label: '已发送'},
                    {type: 'danger', label: '未发送'}
                ]
            }
        },
        components: {
            // 'jibenset': httpVueLoader('./component/jibenset.vue'),
        },
        created: function () {
            this.getList();
        },
        methods: {
            sortChange: function(column) {
                if (column.order == 'descending') {
                    this.sort_type = 'desc';
                } else if (column.order == 'ascending') {
                    this.sort_type = 'asc';
                } else {
                    this.sort_type = '';
                }
                this.sort_col = column.prop
                this.search();
            },
            search(){
                this.currentPage = 1;
                this.getList();
            },
            handleSelectionChange(val) {
                this.selectedItem = [];
                let _this = this;
                if (val.length) {
                    val.forEach(item => {
                        _this.selectedItem.push(item.id);
                    });
                }
                if (_this.selectedItem.length == 0) {
                    _this.checkedAll = false;
                } else {
                    if (_this.selectedItem.length == _this.tableData.length) {
                        _this.checkedAll = true;
                    } else {
                        _this.checkedAll = false;
                    }
                }
            },
            selectAllBottom(value) {
                value ? this.$refs.multipleTable.toggleAllSelection() : this.$refs.multipleTable.clearSelection();
            },
            handleSizeChange(val) {
                this.perPage = val;
                this.getList()
            },
            handleCurrentChange(val) {
                this.currentPage = val;
                this.getList()
            },
            async getList() {
                let that = this;
                let params = {
                    page: that.currentPage,
                    pageSize: that.perPage
                }
                if (that.time) {
                    params.date = that.time[0] + '~' + that.time[1]
                }
                if (that.search_type) {
                    params.type = that.search_type
                }
                if (that.keyword) {
                    params.keyword = that.keyword
                }
                if (that.ctime) {
                    params.ctime = that.ctime
                }
                if (that.result) {
                    params.result = that.result
                }
                if (that.sort_type && that.sort_col) {
                    params.order = that.sort_type
                    params.t = that.sort_col
                }
                that.loading = true;
                that.emptytext = "数据加载中";
                httpPost('m=tool&c=app_push&a=index', params, {hideloading: true}).then(function (result) {
                    var res = result.data
                    if (res.error == 0) {
                        that.tableData = res.data.list
                        that.perPage = parseInt(res.data.perPage)
                        that.pageSizes = res.data.pageSizes
                        that.total = parseInt(res.data.total)
                        that.loading = false;
						
						if(that.prevPage != that.currentPage){
							that.prevPage = that.currentPage;
							that.$refs.multipleTable.bodyWrapper.scrollTop = 0;
						}
                        if (that.tableData.length === 0){
                            that.emptytext = "暂无数据";
                        }
                    }
                }).catch(function (e) {
                    console.log(e)
                })
            },
            delrow(row){
                delConfirm(this, row.id, this.delete);
            },
            delAllBottom(){
                if (!this.selectedItem.length) {
                    message.error('请选择要删除的数据')
                    // this.$message({showClose: true, message: '请选择要删除的数据', type: 'warning'});
                    return false;
                }
                delConfirm(this, this.selectedItem, this.delete);
            },
            async delete(Ids) {
                let that = this;
                let params= {
                    del: Ids
                };
                httpPost('m=tool&c=app_push&a=del', params).then(function (response) {
                    if (response.data.error == 0) {
                        message.success('操作成功');
                        that.getList();
                    }else{
                        message.error(response.data.msg);
                    }
                }).catch(function (error) {
                    console.log(error);
                })
            },
        }
    });
</script>
<style>
.sbdanger{color:#f00}	
</style>
</body>
</html>
