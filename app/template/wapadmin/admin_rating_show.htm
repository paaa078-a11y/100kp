<script type="text/javascript">
    $(function () {
      var now = new Date();
      var currYear = now.getFullYear();
      var currMonth = now.getMonth()+1;
      var currDay = now.getDate();
      var vipetime = '{yun:}$statis.vip_etime|date_format:'%Y-%m-%d'{/yun}';
      
      var vt = new Date(Date.parse(vipetime));

      var opt = {
      preset: 'date', //日期
      theme: 'android-ics light', //皮肤样式
      display: 'modal', //显示方式 
      mode: 'scroller', //日期选择模式
      dateFormat: 'yy-mm-dd', // 日期格式
      setText: '确定', //确认按钮名称
      cancelText: '取消',//取消按钮名籍我
      dateOrder: 'yyyymmdd', //面板中日期排列式
      dayText: '日', monthText: '月', yearText: '年',
      startYear: currYear, //开始年份
      minDate:vt,
      endYear: currYear + 10 //结束年份
    };
    $("#delaytime").mobiscroll('setDate', $("#delaytime").val(), true).date(opt); 
});
</script>
