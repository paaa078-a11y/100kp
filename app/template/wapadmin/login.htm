{yun:}include file="$wapadminstyle/header.htm"{/yun}
<style>
    .bottom_nav {
        width: 100%;
        height: 3.333333rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        margin-top: 1.333333rem;
    }
    .bottom_nav_top {
        font-size: .346667rem;
        color: #666;
    }

    .bottom_nav_center {
        width: 100%;
        display: flex;
        justify-content: space-evenly;
    }

    .bottom_nav_center_logo {
        width: 1.066667rem;
        height: 1.066667rem;
    }
</style>
<body style="background: #fff;">
    <section class="loginTop">
        <img src="{yun:}$config.sy_ossurl{/yun}/{yun:}$config.sy_wap_logo{/yun}" alt="">
    </section>
    <section class="loginSubj">
        <div id="loginVue" class="loginForm">

            <form id="login_form" onsubmit="return false" autocomplete="off" >
                <div class="loginTitle">
                    <!-- <p>Hello!</p> -->
                    <span>欢迎登录后台管理系统</span>
                </div>
                <div class="loginInput">
                    <input type="text" name="username" placeholder="请输入账号">
                </div>
                <div class="loginInput">
                    <input type="password" name="password" placeholder="请输入密码">
                </div>

                <div class="loginInput">
                    <button @click="login" id="login_sub">登录</button>
                </div>
            </form>

        </div>
        <!-- 另外的登录方式  config.sy_qqlogin==1 || $config.sy_sinalogin==1 || -->
        {yun:}if $config.wx_author_htlogin !== '0' && ($config.wx_rz==1 && !$wxid){/yun}
        <div class="bottom_nav">
            <div class="bottom_nav_top">或通过以下方式登录</div>
            <div class="bottom_nav_center">
                {yun:}if $config.wx_rz==1 && !$wxid{/yun}
                <a class="bottom_nav_center_logo" href="index.php?m=wxconnect&c=index">
                    <img src="{yun:}$wap_style{/yun}/images/weixin.png" alt="" width="100%" height="100%">
                </a>
                {yun:}/if{/yun}
                <!--{yun:}if $config.sy_qqlogin==1{/yun}-->
                <!--<a class="bottom_nav_center_logo" href="{yun:}$config.sy_weburl{/yun}/qqlogin.php">-->
                    <!--<img src="{yun:}$wap_style{/yun}/images/QQ@2x.png" alt="" width="100%" height="100%">-->
                <!--</a>-->
                <!--{yun:}/if{/yun}-->
                <!--{yun:}if $config.sy_sinalogin==1{/yun}-->
                <!--<a class="bottom_nav_center_logo" href="{yun:}url m=wap c=sinaconnect{/yun}">-->
                    <!--<img src="{yun:}$wap_style{/yun}/images/weibu.png" alt="" width="100%" height="100%">-->
                <!--</a>-->
                <!--{yun:}/if{/yun}-->
            </div>

        </div>
        {yun:}/if{/yun}
    </section>
</body>
<script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
<script>LA.init({id:"KcU0aPo7V03OPq1y",ck:"KcU0aPo7V03OPq1y"})</script>
<script>
	var loginVue = new Vue({
	        el: '#loginVue',
	        data: {},
			methods:{
				login: function(){
					var field = getFormValue('login_form');
					field.login_sub = '登录';
					if(field.username == ''){
						return showToast('请填写用户名');
					}
					if(field.password == ''){
						return showToast('请填写密码');
					}
					throttle(function(){
						showLoading('登录中');
						$.post('index.php', field, function(res){
							showToast(res.msg, 2, function(){
								if(res.error == 9){
									window.location.reload();
								}
							});
						},'json');
					})
				}
			}
		});
</script>
</html>
